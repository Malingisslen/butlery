# Configuration for Dart & Flutter tests
# https://github.com/dart-lang/test/blob/master/pkgs/test/doc/configuration.md

# Define test tags
tags:
  # Golden tests use visual regression testing
  golden:
    description: Visual regression tests using golden files
    
  # Integration tests that may take longer
  integration:
    description: Integration tests with external dependencies
    timeout: 5m
    
  # Performance tests
  performance:
    description: Performance and benchmark tests
    timeout: 10m
    
  # Tests that require network access
  network:
    description: Tests that make network requests
    
  # Tests that are currently broken
  skip:
    skip: true

  # Corpus prelabel harness — a script shaped as a test. Never runs in CI;
  # gated by the RUN_CORPUS_PRELABEL env var at runtime. Generous timeout
  # because it OCRs a batch of scanned pages over the network.
  corpus-tools:
    description: Cookbook gold-corpus prelabel/eval harness (manual, env-gated)
    timeout: 30m

# Test timeout defaults
timeout: 30s

# Run tests in parallel - REDUCED to prevent memory crashes
# Previous value of 4 was causing VS Code crashes due to memory exhaustion
concurrency: 1

# Reporter configuration
reporter: expanded

# Platform configuration
platforms:
  - vm

# Override settings for CI
on_os:
  windows:
    # Longer timeouts on Windows CI
    timeout: 1m