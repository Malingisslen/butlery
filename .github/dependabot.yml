# Dependabot configuration for Butlery.
# Keeps Flutter (pub), Cloud Functions (npm) and GitHub Actions up to date.
# Weekly Monday cadence + grouping keeps review load manageable for a solo dev.
#
# Major bumps are ignored across all ecosystems — they require hands-on review
# (SDK gates, breaking-change migrations, ToS changes for closed-source actions).
# Coordinate manually when ready. See BUT-562 for context.

version: 2

updates:
  # Flutter / Dart dependencies (root pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore*"
        update-types:
          - "minor"
          - "patch"
      flutter-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase_*"
          - "cloud_firestore*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # BUT-750: plus_plugins maintainers shipped speculative calls to
      # non-existent iOS 26.0/26.1 Apple APIs that fail iOS Build
      # Validation. Both packages pinned to last safe version in
      # pubspec.yaml; ignore here until upstream resolves the gambit.
      #   device_info_plus 12.4.0+: isiOSAppOnVision (issue #3811/#3814)
      #   connectivity_plus 7.1.0+: NWPath.isUltraConstrained (#3787/#3816)
      - dependency-name: "device_info_plus"
      - dependency-name: "connectivity_plus"

  # Cloud Functions (Node/TypeScript)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      firebase-admin:
        patterns:
          - "firebase-*"
          - "@firebase/*"
          - "@google-cloud/*"
        update-types:
          - "minor"
          - "patch"
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-*"
          - "@firebase/*"
          - "@google-cloud/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions used by workflows in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
