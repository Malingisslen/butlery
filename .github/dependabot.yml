# Dependabot Configuration for Butlery
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Pub dependencies (Flutter/Dart packages)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    reviewers:
      - "Malingisslen"
    labels:
      - "dependencies"
      - "dart"
      - "flutter"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      firebase-updates:
        patterns:
          - "firebase_*"
        update-types:
          - "minor"
          - "patch"
      testing-updates:
        patterns:
          - "test"
          - "mocktail"
          - "fake_*"
          - "golden_toolkit"
        update-types:
          - "minor"
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow version updates for dependencies
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3
    reviewers:
      - "Malingisslen"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
