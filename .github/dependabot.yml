# Dependabot configuration for Butlery.
# Keeps Flutter (pub), Cloud Functions (npm) and GitHub Actions up to date.
# Weekly Monday cadence + grouping keeps review load manageable for a solo dev.
#
# Major bumps are ignored across all ecosystems — they require hands-on review
# (SDK gates, breaking-change migrations, ToS changes for closed-source actions).
# Coordinate manually when ready. See BUT-562 for context.

version: 2

updates:
  # Flutter / Dart dependencies (root pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore*"
        update-types:
          - "minor"
          - "patch"
      flutter-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase_*"
          - "cloud_firestore*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # BUT-750: device_info_plus 12.4.0+ ships a call to a non-existent
      # Apple API (`isiOSAppOnVision` gated on iOS 26.1) that fails iOS
      # Build Validation. Pinned at 12.3.0 in pubspec.yaml; ignore all
      # bumps here until upstream issue #3811/#3814 is resolved.
      - dependency-name: "device_info_plus"

  # Cloud Functions (Node/TypeScript)
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      firebase-admin:
        patterns:
          - "firebase-*"
          - "@firebase/*"
          - "@google-cloud/*"
        update-types:
          - "minor"
          - "patch"
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "firebase-*"
          - "@firebase/*"
          - "@google-cloud/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions used by workflows in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependency"
      - "auto"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
