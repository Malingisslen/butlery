name: Coverage

# Full unit run with coverage, the overall and per-area floors, and the Codecov
# upload. Its own workflow so a merge to main cannot cancel it: inside Run
# Tests' cancel-in-progress group, 24 of the 30 main runs before 2026-10-10
# were cancelled before the floor step ran. Here a newer run waits instead.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  # Sharded 4 ways (--total-shards) at --concurrency=4, like the unit lane in
  # test.yml. One job running all of test/unit hit the 60-min cap (issue #1177).
  # Each shard uploads its raw lcov; the merge job unions them with `lcov -a`
  # (hit counts add) and only the merged file is held to the floors. Gating a
  # single shard's partial lcov is the BUT-1182 trap, so no floor runs here.
  unit-shards:
    name: coverage shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Run unit tests (shard ${{ matrix.shard }}/4, with coverage)
        run: |
          flutter test test/unit --coverage \
            --total-shards 4 --shard-index ${{ matrix.shard }} \
            --concurrency=4 --reporter=expanded

      - name: Upload shard lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: coverage (ubuntu)
    needs: unit-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: shard-lcov

      - name: Merge shard coverage
        run: |
          mkdir -p coverage
          args=()
          for f in shard-lcov/*/lcov.info; do args+=(-a "$f"); done
          echo "Merging ${#args[@]} lcov arguments"
          lcov "${args[@]}" -o coverage/lcov.info

      # Produce a filtered lcov matching codecov.yml's ignore list, so the
      # local "project coverage" number and the Codecov dashboard agree.
      - name: Summarise filtered coverage
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — skipping summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/mock_*.dart' \
            'lib/firebase_options.dart' \
            'lib/firebase_options_staging.dart' \
            'lib/l10n/**' \
            'lib/theme/**' \
            --ignore-errors unused \
            -o coverage/lcov_filtered.info

          RAW_PCT=$(lcov --summary coverage/lcov.info \
            | awk '/^  lines/ {print $2}')
          FILTERED_PCT=$(lcov --summary coverage/lcov_filtered.info \
            | awk '/^  lines/ {print $2}')

          {
            echo "## Coverage"
            echo ""
            echo "| Scope | Lines covered |"
            echo "| --- | --- |"
            echo "| Raw (all of \`lib/\`) | ${RAW_PCT:-unknown} |"
            echo "| Filtered (matches codecov.yml ignores) | ${FILTERED_PCT:-unknown} |"
            echo ""
            echo "The floor step below gates on the filtered number."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Filtered coverage: ${FILTERED_PCT:-unknown}"

      # The gate that counts; Codecov only reports. The overall floor guards
      # against a fall and is not a target to climb: a higher total does not
      # mean the tests catch more faults, and an agent can raise it with tests
      # that assert nothing. The per-area floors guard the code where an
      # untested fault costs most. Malin chose 48.0 on 2026-10-10, when the
      # total measured 49.0% on run 38005604339.
      - name: Enforce coverage floors
        if: always()
        run: |
          if [ ! -f coverage/lcov_filtered.info ]; then
            echo "No filtered lcov — skipping floor check"
            exit 0
          fi

          fail=0

          parse_pct() {
            lcov --summary "$1" 2>/dev/null \
              | awk '/^  lines/ {print $2}' | tr -d '%'
          }

          below_floor() {
            awk -v v="$1" -v f="$2" 'BEGIN { exit !(v+0 < f+0) }'
          }

          OVERALL_FLOOR=48.0
          OVERALL_PCT=$(parse_pct coverage/lcov_filtered.info)
          if [ -z "$OVERALL_PCT" ]; then
            echo "::warning::Could not parse overall filtered coverage"
          elif below_floor "$OVERALL_PCT" "$OVERALL_FLOOR"; then
            echo "::error::Overall filtered coverage ${OVERALL_PCT}% < floor ${OVERALL_FLOOR}%"
            fail=1
          else
            echo "Overall filtered coverage ${OVERALL_PCT}% >= ${OVERALL_FLOOR}%"
          fi

          check_area() {
            local name="$1"
            local pattern="$2"
            local floor="$3"
            local out="coverage/area_${name}.info"
            lcov --extract coverage/lcov_filtered.info "$pattern" \
              --ignore-errors unused \
              -o "$out" >/dev/null 2>&1 || true
            if [ ! -s "$out" ]; then
              echo "::warning::No coverage data for ${name} (${pattern})"
              return
            fi
            local pct
            pct=$(parse_pct "$out")
            if [ -z "$pct" ]; then
              echo "::warning::Could not parse ${name} coverage"
              return
            fi
            if below_floor "$pct" "$floor"; then
              echo "::error::${name} coverage ${pct}% < floor ${floor}%"
              fail=1
            else
              echo "${name} coverage ${pct}% >= ${floor}%"
            fi
          }

          check_area "auth" "*/services/auth*" 80.0
          check_area "repositories" "*/repositories/*" 70.0
          check_area "rate_limiting" "*/core/rate_limiting/*" 80.0

          exit $fail

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 — BUT-790 SHA-pin
        with:
          files: coverage/lcov_filtered.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov_filtered.info
          retention-days: 14

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 10
          JOB_LABEL: "coverage (ubuntu)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi
