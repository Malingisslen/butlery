# One-time repair of the `cooked` and `shared` feature-retention flags for the
# days their probes failed (missing indexes; `shared` read a dead collection).
# Dry run unless `apply` is ticked; prints counts only. Deploy the indexes and
# let them finish building first, and do not run it around 06:00 UTC, when the
# nightly analytics chain rewrites the same aggregates.
# See functions/src/analytics/repair-feature-retention.ts.
name: Repair feature retention

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First UTC day to repair (yyyy-mm-dd)"
        type: string
        required: true
        default: "2026-10-04"
      to:
        description: "Last UTC day to repair (yyyy-mm-dd, a finished day)"
        type: string
        required: true
      apply:
        description: "Write the repair (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair cooked/shared flags
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build

      # Short-lived token from Workload Identity Federation, no stored key. The
      # action exports GOOGLE_APPLICATION_CREDENTIALS for firebase and
      # CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE for gcloud.
      - name: Authenticate to Google Cloud (WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Guard — project matches the environment
        env:
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          # The environment's variable, the `.firebaserc` production alias and
          # the WIF token must all name the same project before anything runs.
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::vars.FIREBASE_PROJECT_ID is empty for the production environment." >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$(jq -r '.projects.production // empty' .firebaserc)" ]             || { echo "::error::vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the production alias in .firebaserc." >&2; exit 1; }
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ]             || { echo "::error::The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'." >&2; exit 1; }
          echo "GOOGLE_CLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Run repair
        working-directory: functions
        env:
          APPLY: ${{ github.event.inputs.apply }}
          FROM_DAY: ${{ github.event.inputs.from }}
          TO_DAY: ${{ github.event.inputs.to }}
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then
            node scripts/repair-feature-retention.js --from "$FROM_DAY" --to "$TO_DAY" --apply | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/repair-feature-retention.js --from "$FROM_DAY" --to "$TO_DAY" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
