name: Build Validation

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # Validation job - must pass before builds run
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # BUT-495: record job start so the Report duration step at the end can
    # emit a structured timing line.
    - name: Record job start time
      run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Check formatting
      run: dart format --set-exit-if-changed lib test

    - name: Analyze code (fail on violations)
      run: |
        echo "🔍 Running Flutter analyze with strict mode..."
        flutter analyze --fatal-infos --fatal-warnings

    - name: Run architecture tests (fail on violations)
      run: |
        echo "🏗️ Running architecture tests - must pass to continue..."
        flutter test test/architecture/architecture_test.dart --reporter=expanded

    # BUT-495: report duration; soft budget 10m per ticket spec.
    - name: Report job duration
      if: always()
      env:
        BUDGET_MIN: 10
        JOB_LABEL: "validate"
      run: |
        JOB_END=$(date +%s)
        DURATION_SEC=$((JOB_END - JOB_START))
        DURATION_MIN=$((DURATION_SEC / 60))
        DURATION_REM=$((DURATION_SEC % 60))
        {
          echo "## Build duration"
          echo ""
          echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
          echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
        fi

  # Security scanning - runs in parallel with build after validation
  security-scan:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — BUT-790 SHA-pin
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

  # Secret scanning - runs independently, scans full git history
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Run TruffleHog secret scanner
      uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2 — BUT-790 SHA-pin
      with:
        extra_args: --only-verified

  # Build job - runs Android, Web, iOS and desktop (Linux/macOS/Windows) in
  # parallel after validation passes
  build:
    needs: validate
    timeout-minutes: 60
    # Desktop macOS/Windows builds are non-gating (see allow-failure in the
    # matrix): flutter_onnxruntime (on-device ML) requires a higher desktop
    # deployment target than those projects set, and desktop is not a shipping
    # target (mobile + web only). android/web/ios/linux remain required.
    continue-on-error: ${{ matrix.allow-failure || false }}

    strategy:
      fail-fast: false
      matrix:
        platform: [android, web, ios, linux, macos, windows]
        include:
          # BUT-495 budgets: android 15m, web 10m per ticket spec; iOS 25m
          # (slow Xcode/CocoaPods even on macos-latest, not in ticket scope
          # but instrumented for completeness).
          - platform: android
            runs-on: ubuntu-latest
            budget-min: 15
          - platform: web
            runs-on: ubuntu-latest
            budget-min: 10
          - platform: ios
            runs-on: macos-latest
            budget-min: 25
          # BUT-491 desktop build jobs: catch desktop-specific regressions.
          - platform: linux
            runs-on: ubuntu-latest
            budget-min: 15
          - platform: macos
            runs-on: macos-latest
            budget-min: 25
            allow-failure: true # flutter_onnxruntime desktop deployment-target
          - platform: windows
            runs-on: windows-latest
            budget-min: 20
            allow-failure: true # desktop not a shipping target

    runs-on: ${{ matrix.runs-on }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # BUT-495: record job start so the Report duration step at the end can
    # emit a structured timing line. shell: bash so the Windows runner (default
    # pwsh) executes the same POSIX syntax as the Linux/macOS lanes — BUT-491.
    - name: Record job start time
      shell: bash
      run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Create .env from secrets
      # Firebase platform credentials are NOT in .env — they live in
      # lib/firebase_options.dart as committed, client-safe literals (BUT-762).
      # Only OCR_API_* + ENV are actually consumed at build time.
      # shell: bash for Windows-runner POSIX parity (BUT-491).
      shell: bash
      run: |
        cat > .env << 'ENVEOF'
        ENV=production
        OCR_API_KEY=${{ secrets.OCR_API_KEY }}
        OCR_API_URL=${{ secrets.OCR_API_URL }}
        ENVEOF

    - name: Decode google-services.json
      if: matrix.platform == 'android'
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
        test -s android/app/google-services.json || { echo "::error::google-services.json decode failed or empty — is GOOGLE_SERVICES_JSON_BASE64 set as a repo secret?"; exit 1; }

    - name: Decode release keystore
      if: matrix.platform == 'android'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        test -s android/app/upload-keystore.jks || { echo "::error::KEYSTORE_BASE64 missing or empty — add it as a repo secret (BUT-485)"; exit 1; }
        : "${KEYSTORE_PASSWORD:?::error::KEYSTORE_PASSWORD secret missing}"
        : "${KEY_PASSWORD:?::error::KEY_PASSWORD secret missing}"
        : "${KEY_ALIAS:?::error::KEY_ALIAS secret missing}"
        cat > android/key.properties << EOF
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=upload-keystore.jks
        EOF

    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Cache Gradle
      if: matrix.platform == 'android'
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build Android App Bundle
      if: matrix.platform == 'android'
      env:
        CI: 'true'
      run: |
        echo "Building Android App Bundle with obfuscation..."
        flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --dart-define-from-file=.env

    # BUT-490: publish AAB for manual QA. 14-day retention. Naming
    # includes the commit SHA so multiple PR builds don't collide.
    - name: Upload AAB artifact
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ github.sha }}-android.aab
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 14
        if-no-files-found: error

    - name: Verify AAB signed with release key (not debug)
      if: matrix.platform == 'android'
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        AAB=build/app/outputs/bundle/release/app-release.aab
        test -s "$AAB" || { echo "::error::AAB missing at $AAB"; exit 1; }
        # Unzip META-INF/*.RSA and inspect via keytool. Debug builds carry
        # CN=Android Debug — fail hard if we see it.
        TMP=$(mktemp -d)
        unzip -p "$AAB" 'META-INF/*.RSA' > "$TMP/cert.rsa"
        CERT_OWNER=$(keytool -printcert -file "$TMP/cert.rsa" | grep -i "^Owner:")
        echo "Signing cert owner: $CERT_OWNER"
        if echo "$CERT_OWNER" | grep -qi "Android Debug"; then
          echo "::error::AAB is signed with the debug key — release signing is NOT active"
          exit 1
        fi
        echo "Release signing verified."

    - name: Build for web
      if: matrix.platform == 'web'
      run: |
        echo "🌐 Building for web..."
        flutter build web --release --dart-define-from-file=.env

    # BUT-490: publish web bundle for manual QA. iOS not uploaded — the
    # build runs --no-codesign and isn't installable; deferred to BUT-447.
    - name: Upload web bundle artifact
      if: matrix.platform == 'web'
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ github.sha }}-web
        path: build/web
        retention-days: 14
        if-no-files-found: error

    - name: Get Flutter dependencies (iOS)
      if: matrix.platform == 'ios'
      run: flutter pub get

    - name: Build iOS (no codesign)
      if: matrix.platform == 'ios'
      run: |
        echo "🍎 Building iOS IPA without code signing..."
        # BUT-456: --obfuscate + --split-debug-info match the Android line at
        # the appbundle build above. ProGuard/R8 only strip Java/Kotlin
        # identifiers; without these flags Dart symbols remain readable in
        # the iOS binary. Symbol files in build/debug-info are needed for
        # Crashlytics symbolication once the deploy pipeline (BUT-420)
        # uploads them; until then they're build-job artifacts.
        flutter build ipa --release --no-codesign --obfuscate --split-debug-info=build/debug-info --dart-define-from-file=.env --export-options-plist=ios/exportOptions.plist

    # BUT-491: Linux desktop build. Needs GTK/clang/ninja system deps that
    # aren't preinstalled on the ubuntu runner.
    - name: Install Linux desktop build dependencies
      if: matrix.platform == 'linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev

    - name: Build Linux desktop
      if: matrix.platform == 'linux'
      run: |
        echo "🐧 Building Linux desktop..."
        flutter config --enable-linux-desktop
        flutter build linux --release --dart-define-from-file=.env

    # BUT-491: macOS desktop build (no codesign — verifies it compiles).
    - name: Build macOS desktop
      if: matrix.platform == 'macos'
      run: |
        echo "🍏 Building macOS desktop..."
        flutter config --enable-macos-desktop
        flutter build macos --release --dart-define-from-file=.env

    # BUT-491: Windows desktop build. windows-latest defaults to pwsh; force
    # bash so the run-step style matches the rest of the workflow.
    - name: Build Windows desktop
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        echo "🪟 Building Windows desktop..."
        flutter config --enable-windows-desktop
        flutter build windows --release --dart-define-from-file=.env

    # BUT-495: report duration; per-platform budget from matrix.budget-min.
    # shell: bash so the Windows runner runs the same POSIX timing math (BUT-491).
    - name: Report job duration
      if: always()
      shell: bash
      env:
        BUDGET_MIN: ${{ matrix.budget-min }}
        JOB_LABEL: "build (${{ matrix.platform }})"
      run: |
        JOB_END=$(date +%s)
        DURATION_SEC=$((JOB_END - JOB_START))
        DURATION_MIN=$((DURATION_SEC / 60))
        DURATION_REM=$((DURATION_SEC % 60))
        {
          echo "## Build duration"
          echo ""
          echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
          echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
        fi

  # Summary job
  build-summary:
    runs-on: ubuntu-latest
    needs: [validate, build, security-scan, secret-scan]
    if: always()

    steps:
    - name: Check results
      run: |
        if [ "${{ needs.validate.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.secret-scan.result }}" == "success" ]; then
          echo "✅ All validations passed!"
          echo "✅ Architecture compliance verified"
          echo "✅ Code analysis passed"
          echo "✅ Builds completed successfully"
          echo "✅ Security scans passed"
        else
          echo "❌ Build validation failed"
          exit 1
        fi
