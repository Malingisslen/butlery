name: Build Validation

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  # Validation job - must pass before builds run
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Check formatting
      run: dart format --set-exit-if-changed lib test

    - name: Analyze code (fail on violations)
      run: |
        echo "🔍 Running Flutter analyze with strict mode..."
        flutter analyze --fatal-infos --fatal-warnings

    - name: Run architecture tests (fail on violations)
      run: |
        echo "🏗️ Running architecture tests - must pass to continue..."
        flutter test test/architecture/architecture_test.dart --reporter=expanded

  # Security scanning - runs in parallel with build after validation
  security-scan:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

  # Secret scanning - runs independently, scans full git history
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog secret scanner
      uses: trufflesecurity/trufflehog@v3.94.3
      with:
        extra_args: --only-verified

  # Build job - runs Android, Web and iOS in parallel after validation passes
  build:
    needs: validate
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        platform: [android, web, ios]
        include:
          - platform: android
            runs-on: ubuntu-latest
          - platform: web
            runs-on: ubuntu-latest
          - platform: ios
            runs-on: macos-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Create .env from secrets
      run: |
        cat > .env << 'ENVEOF'
        FIREBASE_API_KEY_WEB=${{ secrets.FIREBASE_API_KEY_WEB }}
        FIREBASE_APP_ID_WEB=${{ secrets.FIREBASE_APP_ID_WEB }}
        FIREBASE_MEASUREMENT_ID_WEB=${{ secrets.FIREBASE_MEASUREMENT_ID_WEB }}
        FIREBASE_API_KEY_ANDROID=${{ secrets.FIREBASE_API_KEY_ANDROID }}
        FIREBASE_APP_ID_ANDROID=${{ secrets.FIREBASE_APP_ID_ANDROID }}
        FIREBASE_API_KEY_IOS=${{ secrets.FIREBASE_API_KEY_IOS }}
        FIREBASE_API_KEY_MACOS=${{ secrets.FIREBASE_API_KEY_MACOS }}
        FIREBASE_APP_ID_IOS=${{ secrets.FIREBASE_APP_ID_IOS }}
        FIREBASE_APP_ID_MACOS=${{ secrets.FIREBASE_APP_ID_MACOS }}
        FIREBASE_API_KEY_WINDOWS=${{ secrets.FIREBASE_API_KEY_WINDOWS }}
        FIREBASE_APP_ID_WINDOWS=${{ secrets.FIREBASE_APP_ID_WINDOWS }}
        FIREBASE_MEASUREMENT_ID_WINDOWS=${{ secrets.FIREBASE_MEASUREMENT_ID_WINDOWS }}
        FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        IOS_BUNDLE_ID=${{ secrets.IOS_BUNDLE_ID }}
        ENV=production
        OCR_API_KEY=${{ secrets.OCR_API_KEY }}
        OCR_API_URL=${{ secrets.OCR_API_URL }}
        ENVEOF

    - name: Decode google-services.json
      if: matrix.platform == 'android'
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
        test -s android/app/google-services.json || { echo "::error::google-services.json decode failed or empty — is GOOGLE_SERVICES_JSON_BASE64 set as a repo secret?"; exit 1; }

    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Cache Gradle
      if: matrix.platform == 'android'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build Android App Bundle
      if: matrix.platform == 'android'
      run: |
        echo "🏗️ Building Android App Bundle with obfuscation..."
        flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --dart-define-from-file=.env

    - name: Build for web
      if: matrix.platform == 'web'
      run: |
        echo "🌐 Building for web..."
        flutter build web --release --dart-define-from-file=.env

    - name: Get Flutter dependencies (iOS)
      if: matrix.platform == 'ios'
      run: flutter pub get

    - name: Build iOS (no codesign)
      if: matrix.platform == 'ios'
      run: |
        echo "🍎 Building iOS IPA without code signing..."
        flutter build ipa --release --no-codesign --dart-define-from-file=.env --export-options-plist=ios/exportOptions.plist

  # Summary job
  build-summary:
    runs-on: ubuntu-latest
    needs: [validate, build, security-scan, secret-scan]
    if: always()

    steps:
    - name: Check results
      run: |
        if [ "${{ needs.validate.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.secret-scan.result }}" == "success" ]; then
          echo "✅ All validations passed!"
          echo "✅ Architecture compliance verified"
          echo "✅ Code analysis passed"
          echo "✅ Builds completed successfully"
          echo "✅ Security scans passed"
        else
          echo "❌ Build validation failed"
          exit 1
        fi
