name: Build Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.4'

jobs:
  # Validation job - must pass before builds run
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code (fail on violations)
      run: |
        echo "🔍 Running Flutter analyze with strict mode..."
        flutter analyze --fatal-infos --fatal-warnings

    - name: Run architecture tests (fail on violations)
      run: |
        echo "🏗️ Running architecture tests - must pass to continue..."
        flutter test test/architecture/architecture_test.dart --reporter=expanded

  # Build job - runs Android and Web in parallel after validation passes
  build:
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        platform: [android, web]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Setup Gradle
      if: matrix.platform == 'android'
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Cache Gradle
      if: matrix.platform == 'android'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Build Android App Bundle
      if: matrix.platform == 'android'
      run: |
        echo "🏗️ Building Android App Bundle with obfuscation..."
        flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

    - name: Build for web
      if: matrix.platform == 'web'
      run: |
        echo "🌐 Building for web..."
        flutter build web --release

  # Summary job
  build-summary:
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: always()

    steps:
    - name: Check results
      run: |
        if [ "${{ needs.validate.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ All validations passed!"
          echo "✅ Architecture compliance verified"
          echo "✅ Code analysis passed"
          echo "✅ Builds completed successfully"
        else
          echo "❌ Build validation failed"
          exit 1
        fi
