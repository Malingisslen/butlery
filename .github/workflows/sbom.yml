name: SBOM (CycloneDX)

# Generates CycloneDX SBOM artifacts covering the pub (Flutter) and npm
# (Cloud Functions) dependency trees on every push to main, weekly on
# Tuesday 05:00 UTC, and on demand. Artifacts are retained 90 days so
# CVE triage can correlate against any recent build.
#
# Tool: @cyclonedx/cdxgen — multi-ecosystem CycloneDX generator that
# natively supports pub (`dart pub deps`) and npm (`package-lock.json`).
# Fails closed on a missing manifest so the artifact is always
# verifiable.
#
# BUT-535. Cosign signing intentionally deferred until an OIDC identity
# is wired (see ticket comments).

on:
  push:
    branches: [main]
    paths:
      - "pubspec.lock"
      - "pubspec.yaml"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/sbom.yml"
  pull_request:
    paths:
      - "pubspec.lock"
      - "pubspec.yaml"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/sbom.yml"
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.35.1"
  # BUT-771: must match functions/package.json `engines.node`. Drift is
  # caught by tools/check_node_version_consistency.sh (dep-audit workflow).
  NODE_VERSION: "22"

jobs:
  sbom:
    name: Generate CycloneDX SBOM (pub + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Resolve pub dependencies
        run: flutter pub get

      - name: Install npm dependencies (functions)
        working-directory: functions
        run: npm ci

      # cdxgen v11 doesn't reliably auto-detect both pub and npm from a
      # single root scan (the previous combined `--type dart,javascript .`
      # produced empty SBOMs since the BUT-810 lockfile bump). Switching
      # to two passes — one per ecosystem, each pointed at its own
      # manifest — and merging via jq. Output is still a single
      # CycloneDX 1.5 JSON for downstream tooling.
      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@11

      - name: Generate pub SBOM (Flutter/Dart)
        env:
          FETCH_LICENSE: "true"
        run: |
          cdxgen \
            --type dart \
            --output sbom-pub.cdx.json \
            --spec-version 1.5 \
            --include-formulation \
            .

      - name: Generate npm SBOM (Cloud Functions)
        working-directory: functions
        env:
          FETCH_LICENSE: "true"
        run: |
          cdxgen \
            --type javascript \
            --output ../sbom-npm.cdx.json \
            --spec-version 1.5 \
            --include-formulation \
            .

      - name: Merge SBOMs and gate on component count
        run: |
          # Concatenate the two `.components` arrays into a single SBOM
          # rooted at the pub metadata. Names collide rarely (different
          # ecosystem prefixes) so we deliberately don't dedupe.
          jq -s '.[0] + {components: (.[0].components + .[1].components)}' \
            sbom-pub.cdx.json sbom-npm.cdx.json > sbom-butlery.cdx.json

          components=$(jq '.components | length' sbom-butlery.cdx.json)
          pub=$(jq '.components | length' sbom-pub.cdx.json)
          npm=$(jq '.components | length' sbom-npm.cdx.json)
          echo "SBOM components — pub: $pub, npm: $npm, merged: $components"
          if [ "$components" = "0" ] || [ "$components" = "null" ]; then
            echo "::error::SBOM has zero components — generator failed"
            exit 1
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: butlery-sbom-${{ github.sha }}
          path: sbom-butlery.cdx.json
          retention-days: 90
          if-no-files-found: error
