name: Run Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  unit-tests:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # BUT-835 follow-up: split test/unit (~435 files) from test/widget
        # (~97), test/views (~14), and test/golden (~2) so each suite gets
        # its own 20-min budget. The combined run was hitting the cap at
        # ~19 min and getting cancelled, masking real test signal.
        # Coverage is still aggregated post-job by Codecov via flag merging.
        suite: [unit, widget, views, golden]
        # BUT-849: golden tests are deterministic structure/JSON checks,
        # not pixel diffs. Running on three platforms is redundant, and the
        # Windows lane was producing line-ending/encoding noise that
        # masked real signal from ubuntu+macos. Gate it off here.
        exclude:
          - os: windows-latest
            suite: golden
    runs-on: ${{ matrix.os }}
    # Bumped 20 → 30. unit (macos) was finishing in 16-17 min in green
    # runs but landing right at the 20 cap on slower runners → silent
    # cancels that looked like real failures. 30 leaves ~10 min headroom
    # while still failing fast on truly hung jobs.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # BUT-495: record job start so the Report duration step at the end can
      # emit a structured timing line. Lives in $GITHUB_ENV so the value
      # survives between steps. Force bash so the same `$(date +%s)` /
      # `>> "$GITHUB_ENV"` syntax works on the windows runner too (default
      # there is PowerShell, which silently mangles the subshell capture).
      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Real-time guard (BUT-393). Fails fast if a PR reintroduces
      # `DateTime.now()` in a new unit test outside the allowlist, or any
      # long `Future.delayed(...)` in unit/widget/view/integration tests.
      # Guards the BUT-387 Phase 5 rescue against decay.
      - name: Real-time regression guard
        run: bash scripts/check_test_real_time.sh

      # lcov isn't preinstalled on ubuntu-latest. Install before we run
      # tests so the summary step below can actually produce a number.
      # Coverage summary + Codecov upload only run on ubuntu + the `unit`
      # suite (the largest one — its line numbers dominate the dashboard).
      - name: Install lcov
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'unit'
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Run a single suite. The 4-way split (unit / widget / views / golden)
      # gives each its own 20-min job budget — see matrix comment above.
      # Coverage instrumentation is only collected for the `unit` suite on
      # ubuntu (the suite that drives the dashboard); other suites skip
      # `--coverage` to save runtime. `test/golden/` holds parsing & tagging
      # golden datasets that don't hit Firebase or the network (LLM tier
      # uses a service-level mock; see test/golden/README.md).
      - name: Run ${{ matrix.suite }} tests (with coverage)
        if: matrix.suite == 'unit' && matrix.os == 'ubuntu-latest'
        run: |
          echo "Running test/${{ matrix.suite }} with coverage..."
          flutter test test/${{ matrix.suite }} --coverage --reporter=expanded

      - name: Run ${{ matrix.suite }} tests
        if: matrix.suite != 'unit' || matrix.os != 'ubuntu-latest'
        run: |
          echo "Running test/${{ matrix.suite }}..."
          flutter test test/${{ matrix.suite }} --reporter=expanded

      # Produce a filtered lcov.info matching codecov.yml's ignore list, so
      # the local "project coverage" number and the Codecov dashboard agree.
      # No hard gate yet — Codecov owns the drop-tolerance gate via the
      # `if_ci_failed: error` rule in codecov.yml. Once we've observed a
      # real baseline from CI, a follow-up PR adds a local floor check
      # that guards against the Codecov token being unavailable.
      - name: Summarise filtered coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.suite == 'unit'
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — skipping summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/mock_*.dart' \
            'lib/firebase_options.dart' \
            'lib/l10n/**' \
            'lib/theme/**' \
            --ignore-errors unused \
            -o coverage/lcov_filtered.info

          RAW_PCT=$(lcov --summary coverage/lcov.info \
            | awk '/^  lines/ {print $2}')
          FILTERED_PCT=$(lcov --summary coverage/lcov_filtered.info \
            | awk '/^  lines/ {print $2}')

          {
            echo "## Coverage"
            echo ""
            echo "| Scope | Lines covered |"
            echo "| --- | --- |"
            echo "| Raw (all of \`lib/\`) | ${RAW_PCT:-unknown} |"
            echo "| Filtered (matches codecov.yml ignores) | ${FILTERED_PCT:-unknown} |"
            echo ""
            echo "The filtered number is what Codecov gates on (60% target, 2% drop tolerance)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Filtered coverage: ${FILTERED_PCT:-unknown}"

      # Hard local coverage floor. Codecov is the primary gate, but if the
      # token is unavailable (outage, rotated secret) the dashboard fails
      # open. This step fails the build locally so regressions can't sneak
      # in. Floors are intentionally loose until we've logged ~5 runs and
      # can tighten to observed-baseline-minus-2pp.
      - name: Enforce coverage floors
        if: always() && matrix.os == 'ubuntu-latest' && matrix.suite == 'unit'
        run: |
          if [ ! -f coverage/lcov_filtered.info ]; then
            echo "No filtered lcov — skipping floor check"
            exit 0
          fi

          fail=0

          parse_pct() {
            lcov --summary "$1" 2>/dev/null \
              | awk '/^  lines/ {print $2}' | tr -d '%'
          }

          below_floor() {
            awk -v v="$1" -v f="$2" 'BEGIN { exit !(v+0 < f+0) }'
          }

          OVERALL_FLOOR=55.0
          OVERALL_PCT=$(parse_pct coverage/lcov_filtered.info)
          if [ -z "$OVERALL_PCT" ]; then
            echo "::warning::Could not parse overall filtered coverage"
          elif below_floor "$OVERALL_PCT" "$OVERALL_FLOOR"; then
            echo "::error::Overall filtered coverage ${OVERALL_PCT}% < floor ${OVERALL_FLOOR}%"
            fail=1
          else
            echo "Overall filtered coverage ${OVERALL_PCT}% >= ${OVERALL_FLOOR}%"
          fi

          check_area() {
            local name="$1"
            local pattern="$2"
            local floor="$3"
            local out="coverage/area_${name}.info"
            lcov --extract coverage/lcov_filtered.info "$pattern" \
              --ignore-errors unused \
              -o "$out" >/dev/null 2>&1 || true
            if [ ! -s "$out" ]; then
              echo "::warning::No coverage data for ${name} (${pattern})"
              return
            fi
            local pct
            pct=$(parse_pct "$out")
            if [ -z "$pct" ]; then
              echo "::warning::Could not parse ${name} coverage"
              return
            fi
            if below_floor "$pct" "$floor"; then
              echo "::error::${name} coverage ${pct}% < floor ${floor}%"
              fail=1
            else
              echo "${name} coverage ${pct}% >= ${floor}%"
            fi
          }

          check_area "auth" "*/services/auth*" 80.0
          check_area "repositories" "*/repositories/*" 70.0
          check_area "rate_limiting" "*/core/rate_limiting/*" 80.0

          exit $fail

      # Upload coverage to Codecov — this is the real gate (see codecov.yml).
      - name: Upload coverage to Codecov
        if: success() && matrix.os == 'ubuntu-latest' && matrix.suite == 'unit'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 — BUT-790 SHA-pin
        with:
          files: coverage/lcov_filtered.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Keep the filtered lcov as an artifact so a maintainer can download
      # and inspect line-by-line coverage from any run.
      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest' && matrix.suite == 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov_filtered.info
          retention-days: 14

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-results-${{ matrix.os }}
          path: test_results/

      # BUT-495: emit job duration to step summary + warn if budget exceeded.
      # Soft budget = 15 min; hard kill is `timeout-minutes: 30` above.
      # `shell: bash` so the bash `if [ ... ]; then` conditional works on
      # the windows runner too — the default PowerShell parses `if [` as a
      # generic-type call and bails (was the widget (windows) red lane).
      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "${{ matrix.suite }} (${{ matrix.os }})"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # BUT-495: record job start (see unit-tests job for rationale).
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Setup Java for Firebase Emulator (firebase-tools requires Java 21+)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version
      
      - run: flutter pub get
      
      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi
          
          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &

          # BUT-489: real health-gate. The previous `sleep 10 + curl || echo`
          # pattern reported success regardless of emulator state, so a
          # failed-to-start emulator silently passed integration tests.
          # Wait up to 60s on each emulator port, hard-fail if either
          # never comes up. Pattern mirrors firestore-rules.yml:79-85.
          wait_for_port() {
            local name="$1"
            local url="$2"
            local timeout=60
            until curl -sf "$url" >/dev/null 2>&1; do
              sleep 2
              timeout=$((timeout - 2))
              if [ $timeout -le 0 ]; then
                echo "::error::$name emulator failed to come up at $url within 60s"
                exit 1
              fi
            done
            echo "$name emulator ready at $url"
          }
          wait_for_port "Firestore" "http://localhost:8080/"
          wait_for_port "Auth" "http://localhost:9099/"
      
      # Run integration tests only
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi
      
      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        run: |
          # Kill all Firebase emulator processes
          pkill -f "firebase" || true
      
      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test_results/

      # BUT-495: emit job duration to step summary + warn if budget exceeded.
      - name: Report job duration
        if: always()
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "Integration Tests"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi