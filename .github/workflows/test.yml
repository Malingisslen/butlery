name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      
      - run: flutter pub get
      
      # Kommer köra tester när du har några
      - name: Run tests
        run: flutter test
        continue-on-error: true  # Failar inte om inga tester finns