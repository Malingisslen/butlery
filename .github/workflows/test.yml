name: Run Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # lcov isn't preinstalled on ubuntu-latest. Install before we run
      # tests so the summary step below can actually produce a number.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Run unit, widget, and view tests with coverage
      - name: Run unit, widget, and view tests
        run: |
          echo "Running unit, widget, and view tests with coverage..."
          flutter test test/unit test/widget test/views --coverage --reporter=expanded

      # Produce a filtered lcov.info matching codecov.yml's ignore list, so
      # the local "project coverage" number and the Codecov dashboard agree.
      # No hard gate yet — Codecov owns the drop-tolerance gate via the
      # `if_ci_failed: error` rule in codecov.yml. Once we've observed a
      # real baseline from CI, a follow-up PR adds a local floor check
      # that guards against the Codecov token being unavailable.
      - name: Summarise filtered coverage
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — skipping summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/mock_*.dart' \
            'lib/firebase_options.dart' \
            'lib/l10n/**' \
            'lib/theme/**' \
            --ignore-errors unused \
            -o coverage/lcov_filtered.info

          RAW_PCT=$(lcov --summary coverage/lcov.info \
            | awk '/^  lines/ {print $2}')
          FILTERED_PCT=$(lcov --summary coverage/lcov_filtered.info \
            | awk '/^  lines/ {print $2}')

          {
            echo "## Coverage"
            echo ""
            echo "| Scope | Lines covered |"
            echo "| --- | --- |"
            echo "| Raw (all of \`lib/\`) | ${RAW_PCT:-unknown} |"
            echo "| Filtered (matches codecov.yml ignores) | ${FILTERED_PCT:-unknown} |"
            echo ""
            echo "The filtered number is what Codecov gates on (60% target, 2% drop tolerance)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Filtered coverage: ${FILTERED_PCT:-unknown}"

      # Upload coverage to Codecov — this is the real gate (see codecov.yml).
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov_filtered.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Keep the filtered lcov as an artifact so a maintainer can download
      # and inspect line-by-line coverage from any run.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov_filtered.info
          retention-days: 14

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test_results/
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Setup Java for Firebase Emulator (firebase-tools requires Java 21+)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version
      
      - run: flutter pub get
      
      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi
          
          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &
          
          # Wait for emulators to be ready
          sleep 10
          
          # Check if emulators are running
          curl -f http://localhost:8080 || echo "Firestore emulator may not be fully ready"
      
      # Run integration tests only
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi
      
      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        run: |
          # Kill all Firebase emulator processes
          pkill -f "firebase" || true
      
      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test_results/