name: Run Tests

# BUT-1193: per-commit / PR feedback is fast and ubuntu-only; the slow legs
# (coverage instrumentation, macOS + Windows cross-OS matrix) are decoupled to
# a nightly schedule + push-to-main. Rationale:
#
#  - Dart/Flutter unit/widget/view behaviour is OS-independent, so running the
#    full 3-OS matrix on every commit bought almost no signal for ~3× the
#    compute. Cross-OS regression coverage moves to the nightly `cross-os` job.
#  - The `views (windows-latest)` leg was an intermittent infra flake (BUT-1192:
#    fails with no test output, clears on re-run). Moving it off the critical
#    path means a flake can no longer block a commit.
#  - Coverage instrumentation roughly doubles unit-suite runtime and can't be
#    sharded (a naive split gives each shard a PARTIAL lcov → false 55%-floor
#    failures — the trap BUT-1182 hit). So the per-commit unit run drops
#    `--coverage` and is sharded 3 ways for fast feedback; the full
#    coverage+floor gate runs in its own workflow, coverage.yml.
#
# What still gates a PR: ubuntu unit (3 shards) + widget + views + golden +
# evaluation + import_gate + integration here, plus firestore-rules / E2E /
# Architecture / Build Validation in their own workflows. Cross-OS is nightly only.

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    # A draft gets no CI; marking it ready for review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  schedule:
    # 04:00 UTC nightly — off-peak, and clear of e2e (02:00), adoption (03:00)
    # and golden-llm (03:17) so the cross-OS leg does not contend for
    # runners with the other scheduled jobs.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # ── Per-commit fast path ────────────────────────────────────────────────
  # Ubuntu-only, no coverage, unit suite sharded 3 ways. Each shard runs ~1/3
  # of test/unit. Measured on PR #179 (4- vs 6-shard A/B): a shard's wall-clock
  # is almost INDEPENDENT of how many tests it runs (3492 tests → 12m34s vs
  # 2222 tests → 12m02s). The dominant cost is the fixed Flutter compile of the
  # app graph that every `flutter test` invocation re-pays (~11-12 min). The
  # execution share was ~1 min/shard when this was measured; it has grown since
  # (see the timeout note below). So sharding hits a ~12 min floor and
  # more shards just multiply the redundant compile for ~no wall-clock gain —
  # the wall BUT-1182 hit (it mis-read it as coverage instrumentation; it's the
  # compile). 3 shards is the cost/latency sweet spot.
  # Pushing below ~12 min needs a bigger runner or a cached test kernel, not
  # more shards. Coverage lives in coverage.yml, not here.
  unit-tests:
    if: github.event.pull_request.draft != true
    name: unit (ubuntu shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    # Measured 2026-09-06 on run 34041557438: passing shards took 17m24s and
    # 18m42s, and the third was killed at 20m16s while still emitting results —
    # not hung, just out of budget. The compile floor above is unchanged; what
    # grew is the execution share, so 20 had stopped leaving any headroom and
    # whichever shard was slowest that day tipped over. Three consecutive main
    # runs were lost to it before anyone read past the word "cancelled".
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # BUT-495: record job start so the Report duration step can emit a
      # structured timing line. Lives in $GITHUB_ENV so it survives between
      # steps.
      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Real-time guard (BUT-393). Static grep over test files — only needs to
      # run once per pipeline, so gate it to shard 0.
      # Called with NO arguments on purpose: lefthook scopes the same script to
      # the staged files for speed, and this full-tree run is what makes that
      # scoping safe. Do not narrow it here.
      - name: Real-time regression guard
        if: matrix.shard == 0
        run: bash scripts/check_test_real_time.sh

      # The guard's own fixtures (BUT-1894). It had none, and a rewrite that
      # failed open on two inputs got as far as review before anyone built one.
      - name: Real-time guard fixtures
        if: matrix.shard == 0
        run: bash scripts/__tests__/check_test_real_time_test.sh

      - name: Run unit tests (shard ${{ matrix.shard }}/3, no coverage)
        run: |
          echo "Running test/unit shard ${{ matrix.shard }} of 3..."
          flutter test test/unit \
            --total-shards 3 --shard-index ${{ matrix.shard }} \
            --concurrency=4 --reporter=expanded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-shard-${{ matrix.shard }}
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 24
          JOB_LABEL: "unit (ubuntu shard ${{ matrix.shard }}/3)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Per-commit fast path: smaller suites ────────────────────────────────
  # widget (~97 files), views (~14), golden (~2) are small enough to run whole
  # on ubuntu without coverage. test/golden holds deterministic structure/JSON
  # checks (service-level LLM mock — no Firebase / network).
  # evaluation (~1): the CRF ingredient-parser golden eval — deterministic
  # (JSON weights, no network/Firebase), enforces an all-fields-exact >=85% gate
  # against a 433-entry golden set, so parser-accuracy regressions fail CI
  # (BUT-1443). Verified green at wiring time.
  suite-tests:
    if: github.event.pull_request.draft != true
    name: ${{ matrix.suite }} (ubuntu)
    strategy:
      fail-fast: false
      matrix:
        # import_gate (BUT-2236): the import corpora in test/import_gate/,
        # scored against gold and held to its floors.json; prints its table
        # into the job summary.
        suite: [widget, views, golden, evaluation, import_gate]
        # BUT-1676: small directories no lane ran, sharing one runner.
        # tools/check_test_suite_coverage.sh fails on any test/ directory
        # that is neither run here nor in tools/test_suite_allowlist.txt.
        include:
          - suite: small-dirs
            paths: test/corpus test/infrastructure test/l10n test/scripts test/services test/smoke test/tools
    runs-on: ubuntu-latest
    # BUT-2001: widget took 16m30s on main run 37685482331, so 20 left the
    # same thin margin the unit shards ran out of.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Run ${{ matrix.suite }} tests
        run: |
          paths="${{ matrix.paths || format('test/{0}', matrix.suite) }}"
          echo "Running $paths..."
          flutter test $paths --concurrency=4 --reporter=expanded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-results-ubuntu
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 24
          JOB_LABEL: "${{ matrix.suite }} (ubuntu)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Cross-OS regression matrix (nightly only) ───────────────────────────
  # macOS + Windows × all suites. Catches the rare OS-specific regression
  # (path separators, line-endings, locale) without paying for it on every
  # commit. golden is excluded on Windows (BUT-849: line-ending/encoding noise
  # on a deterministic JSON suite). The `views (windows)` infra flake
  # (BUT-1192) lives here now, off the per-commit critical path.
  cross-os:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        suite: [unit, widget, views, golden]
        exclude:
          - os: windows-latest
            suite: golden
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # BUT-1192: the views (windows-latest) leg intermittently exits with NO
      # test output (an infra hang before the reporter emits — flutter-action
      # cache-restore race / locale init / runner starvation) and clears on a
      # plain re-run. A bounded 2-attempt retry absorbs that infra flake. It
      # does NOT mask real regressions: an assertion failure is deterministic
      # and fails both attempts identically, so a genuine break still goes red
      # (just one re-run later). Scoped to the nightly cross-OS matrix only —
      # off the per-commit critical path, fail-fast:false. Whole-matrix rather
      # than special-casing one cell: any cross-OS leg can take an infra flake.
      - name: Run ${{ matrix.suite }} tests
        shell: bash
        run: |
          echo "Running test/${{ matrix.suite }} on ${{ matrix.os }}..."
          max_attempts=2
          attempt=1
          until flutter test test/${{ matrix.suite }} --reporter=expanded; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::test/${{ matrix.suite }} on ${{ matrix.os }} failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::test/${{ matrix.suite }} on ${{ matrix.os }} attempt ${attempt} failed — retrying (BUT-1192 infra-flake absorber)"
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-results-${{ matrix.os }}
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 30
          JOB_LABEL: "${{ matrix.suite }} (${{ matrix.os }})"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Integration tests (per-commit, ubuntu) ──────────────────────────────
  # Firebase-emulator integration suite. Ubuntu-only already and not a
  # bottleneck, so it stays on the per-commit path unchanged.
  integration-tests:
    if: github.event.pull_request.draft != true
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Setup Java for Firebase Emulator (firebase-tools requires Java 21+)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version

      - run: flutter pub get

      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi

          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &

          # BUT-489: real health-gate. Wait up to 60s on each emulator port,
          # hard-fail if either never comes up.
          wait_for_port() {
            local name="$1"
            local url="$2"
            local timeout=60
            until curl -sf "$url" >/dev/null 2>&1; do
              sleep 2
              timeout=$((timeout - 2))
              if [ $timeout -le 0 ]; then
                echo "::error::$name emulator failed to come up at $url within 60s"
                exit 1
              fi
            done
            echo "$name emulator ready at $url"
          }
          wait_for_port "Firestore" "http://localhost:8080/"
          wait_for_port "Auth" "http://localhost:9099/"

      # Run integration tests only
      #
      # BUT-1695: this job boots the emulators above, but the run below is
      # deliberately still MOCK tier — no `--dart-define=USE_EMULATOR=true`.
      # Adding the define does not work: the emulator lane calls
      # `Firebase.initializeApp`, and under `flutter test` (Dart VM, no plugin
      # registrants) that throws
      #   PlatformException(channel-error, Unable to establish connection on
      #   channel "...FirebaseCoreHostApi.initializeCore")
      # — reproduced locally on the exact command, so flipping the define here
      # would turn this job red rather than covering anything. The emulator
      # lane needs a host that can load the FlutterFire plugins
      # (`integration_test` on a device/emulator) or a pure-Dart Firestore
      # client; that is a project, not a flag. Until then the three
      # `emulatorOnlySkip` suites are honestly reported as skipped, and the
      # emulator boot above is kept for the tests that talk to it directly.
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests (mock tier — see BUT-1695)..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi

      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        # BUT-2204: wait for the emulators to EXIT, not just signal them. The
        # flutter-action post step hashes `**/pubspec.lock` across the whole
        # workspace, and it failed there with every test passed (run
        # 37685482331); the emulators are what is still running at that point.
        run: |
          pkill -f "firebase" || true
          for _ in $(seq 1 30); do
            pgrep -f "firebase" >/dev/null || break
            sleep 1
          done
          pkill -9 -f "firebase" || true
          rm -f ./*-debug.log

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test_results/

      # BUT-495: emit job duration to step summary + warn if budget exceeded.
      - name: Report job duration
        if: always()
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "Integration Tests"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi
