name: Run Tests

# BUT-1193: per-commit / PR feedback is fast and ubuntu-only; the slow legs
# (coverage instrumentation, macOS + Windows cross-OS matrix) are decoupled to
# a nightly schedule + push-to-main. Rationale:
#
#  - Dart/Flutter unit/widget/view behaviour is OS-independent, so running the
#    full 3-OS matrix on every commit bought almost no signal for ~3× the
#    compute. Cross-OS regression coverage moves to the nightly `cross-os` job.
#  - The `views (windows-latest)` leg was an intermittent infra flake (BUT-1192:
#    fails with no test output, clears on re-run). Moving it off the critical
#    path means a flake can no longer block a commit.
#  - Coverage instrumentation roughly doubles unit-suite runtime and can't be
#    sharded (a naive split gives each shard a PARTIAL lcov → false 55%-floor
#    failures — the trap BUT-1182 hit). So the per-commit unit run drops
#    `--coverage` and is sharded 3 ways for fast feedback; the full
#    coverage+floor+Codecov gate runs in the separate `coverage` job nightly and
#    on push-to-main. The 55% floor is unchanged — only re-timed (BUT-1149).
#
# What still gates a PR: ubuntu unit (3 shards) + widget + views + golden +
# integration here, plus firestore-rules / E2E / Architecture / Build Validation
# in their own workflows. Coverage + cross-OS are nightly/main only.

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  schedule:
    # 04:00 UTC nightly — off-peak, and clear of e2e (02:00), adoption (03:00)
    # and golden-llm (03:17) so the cross-OS + coverage legs don't contend for
    # runners with the other scheduled jobs.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # ── Per-commit fast path ────────────────────────────────────────────────
  # Ubuntu-only, no coverage, unit suite sharded 3 ways. Each shard runs ~1/3
  # of test/unit. Measured on PR #179 (4- vs 6-shard A/B): a shard's wall-clock
  # is almost INDEPENDENT of how many tests it runs (3492 tests → 12m34s vs
  # 2222 tests → 12m02s). The dominant cost is the fixed Flutter compile of the
  # app graph that every `flutter test` invocation re-pays (~11-12 min); actual
  # test execution is only ~1 min/shard. So sharding hits a ~12 min floor and
  # more shards just multiply the redundant compile for ~no wall-clock gain —
  # the wall BUT-1182 hit (it mis-read it as coverage instrumentation; it's the
  # compile). 3 shards is the cost/latency sweet spot (~12.5 min, 3× compile).
  # Pushing below ~12 min needs a bigger runner or a cached test kernel, not
  # more shards. Coverage lives in the `coverage` job below, not here.
  unit-tests:
    name: unit (ubuntu shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    # ~12.5 min/shard (compile-bound). 20 leaves headroom while still catching
    # a genuinely hung shard.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      # BUT-495: record job start so the Report duration step can emit a
      # structured timing line. Lives in $GITHUB_ENV so it survives between
      # steps.
      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Real-time guard (BUT-393). Static grep over test files — only needs to
      # run once per pipeline, so gate it to shard 0.
      - name: Real-time regression guard
        if: matrix.shard == 0
        run: bash scripts/check_test_real_time.sh

      - name: Run unit tests (shard ${{ matrix.shard }}/3, no coverage)
        run: |
          echo "Running test/unit shard ${{ matrix.shard }} of 3..."
          flutter test test/unit \
            --total-shards 3 --shard-index ${{ matrix.shard }} \
            --reporter=expanded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-shard-${{ matrix.shard }}
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "unit (ubuntu shard ${{ matrix.shard }}/3)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Per-commit fast path: smaller suites ────────────────────────────────
  # widget (~97 files), views (~14), golden (~2) are small enough to run whole
  # on ubuntu without coverage. test/golden holds deterministic structure/JSON
  # checks (service-level LLM mock — no Firebase / network).
  # evaluation (~1): the CRF ingredient-parser golden eval — deterministic
  # (JSON weights, no network/Firebase), enforces an all-fields-exact >=85% gate
  # against a 433-entry golden set, so parser-accuracy regressions fail CI
  # (BUT-1443). Verified green at wiring time.
  suite-tests:
    name: ${{ matrix.suite }} (ubuntu)
    strategy:
      fail-fast: false
      matrix:
        suite: [widget, views, golden, evaluation]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Run ${{ matrix.suite }} tests
        run: |
          echo "Running test/${{ matrix.suite }}..."
          flutter test test/${{ matrix.suite }} --reporter=expanded

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-results-ubuntu
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "${{ matrix.suite }} (ubuntu)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Coverage gate (nightly + push-to-main) ──────────────────────────────
  # The slowest single job: ubuntu unit WITH coverage instrumentation, the
  # filtered-lcov summary, the hard 55% floor + per-area floors, and the
  # Codecov upload. Decoupled from the per-commit path so PRs get fast
  # feedback; coverage is still enforced on every push to main and nightly.
  # `github.ref == 'refs/heads/main'` holds for both push-to-main and the
  # scheduled run (schedule checks out the default branch).
  coverage:
    name: coverage (ubuntu)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Coverage instrumentation roughly doubles the unaffected ~28 min unit
    # runtime; keep BUT-1182's 40-min cap here where it actually applies.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # lcov isn't preinstalled on ubuntu-latest; install before tests so the
      # summary + floor steps can produce a number.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run unit tests (with coverage)
        run: |
          echo "Running test/unit with coverage..."
          flutter test test/unit --coverage --reporter=expanded

      # Produce a filtered lcov matching codecov.yml's ignore list, so the
      # local "project coverage" number and the Codecov dashboard agree.
      - name: Summarise filtered coverage
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info — skipping summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            '**/*.mocks.dart' \
            '**/mock_*.dart' \
            'lib/firebase_options.dart' \
            'lib/l10n/**' \
            'lib/theme/**' \
            --ignore-errors unused \
            -o coverage/lcov_filtered.info

          RAW_PCT=$(lcov --summary coverage/lcov.info \
            | awk '/^  lines/ {print $2}')
          FILTERED_PCT=$(lcov --summary coverage/lcov_filtered.info \
            | awk '/^  lines/ {print $2}')

          {
            echo "## Coverage"
            echo ""
            echo "| Scope | Lines covered |"
            echo "| --- | --- |"
            echo "| Raw (all of \`lib/\`) | ${RAW_PCT:-unknown} |"
            echo "| Filtered (matches codecov.yml ignores) | ${FILTERED_PCT:-unknown} |"
            echo ""
            echo "The filtered number is what Codecov gates on (60% target, 2% drop tolerance)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Filtered coverage: ${FILTERED_PCT:-unknown}"

      # Hard local coverage floor. Codecov is the primary gate, but if the
      # token is unavailable (outage, rotated secret) the dashboard fails open;
      # this step fails the build locally so regressions can't sneak in.
      # BUT-1149: temporarily 55.0 (from 60.0); restore to 60.0 after the
      # follow-up sprint pushes the remaining ~5pp. BUT-1193 did NOT change
      # this floor — only re-timed when it runs.
      - name: Enforce coverage floors
        if: always()
        run: |
          if [ ! -f coverage/lcov_filtered.info ]; then
            echo "No filtered lcov — skipping floor check"
            exit 0
          fi

          fail=0

          parse_pct() {
            lcov --summary "$1" 2>/dev/null \
              | awk '/^  lines/ {print $2}' | tr -d '%'
          }

          below_floor() {
            awk -v v="$1" -v f="$2" 'BEGIN { exit !(v+0 < f+0) }'
          }

          OVERALL_FLOOR=55.0  # BUT-1149: restore to 60.0 after follow-up sprint
          OVERALL_PCT=$(parse_pct coverage/lcov_filtered.info)
          if [ -z "$OVERALL_PCT" ]; then
            echo "::warning::Could not parse overall filtered coverage"
          elif below_floor "$OVERALL_PCT" "$OVERALL_FLOOR"; then
            echo "::error::Overall filtered coverage ${OVERALL_PCT}% < floor ${OVERALL_FLOOR}%"
            fail=1
          else
            echo "Overall filtered coverage ${OVERALL_PCT}% >= ${OVERALL_FLOOR}%"
          fi

          check_area() {
            local name="$1"
            local pattern="$2"
            local floor="$3"
            local out="coverage/area_${name}.info"
            lcov --extract coverage/lcov_filtered.info "$pattern" \
              --ignore-errors unused \
              -o "$out" >/dev/null 2>&1 || true
            if [ ! -s "$out" ]; then
              echo "::warning::No coverage data for ${name} (${pattern})"
              return
            fi
            local pct
            pct=$(parse_pct "$out")
            if [ -z "$pct" ]; then
              echo "::warning::Could not parse ${name} coverage"
              return
            fi
            if below_floor "$pct" "$floor"; then
              echo "::error::${name} coverage ${pct}% < floor ${floor}%"
              fail=1
            else
              echo "${name} coverage ${pct}% >= ${floor}%"
            fi
          }

          check_area "auth" "*/services/auth*" 80.0
          check_area "repositories" "*/repositories/*" 70.0
          check_area "rate_limiting" "*/core/rate_limiting/*" 80.0

          exit $fail

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 — BUT-790 SHA-pin
        with:
          files: coverage/lcov_filtered.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov_filtered.info
          retention-days: 14

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 35
          JOB_LABEL: "coverage (ubuntu)"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Cross-OS regression matrix (nightly only) ───────────────────────────
  # macOS + Windows × all suites. Catches the rare OS-specific regression
  # (path separators, line-endings, locale) without paying for it on every
  # commit. golden is excluded on Windows (BUT-849: line-ending/encoding noise
  # on a deterministic JSON suite). The `views (windows)` infra flake
  # (BUT-1192) lives here now, off the per-commit critical path.
  cross-os:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        suite: [unit, widget, views, golden]
        exclude:
          - os: windows-latest
            suite: golden
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # BUT-1192: the views (windows-latest) leg intermittently exits with NO
      # test output (an infra hang before the reporter emits — flutter-action
      # cache-restore race / locale init / runner starvation) and clears on a
      # plain re-run. A bounded 2-attempt retry absorbs that infra flake. It
      # does NOT mask real regressions: an assertion failure is deterministic
      # and fails both attempts identically, so a genuine break still goes red
      # (just one re-run later). Scoped to the nightly cross-OS matrix only —
      # off the per-commit critical path, fail-fast:false. Whole-matrix rather
      # than special-casing one cell: any cross-OS leg can take an infra flake.
      - name: Run ${{ matrix.suite }} tests
        shell: bash
        run: |
          echo "Running test/${{ matrix.suite }} on ${{ matrix.os }}..."
          max_attempts=2
          attempt=1
          until flutter test test/${{ matrix.suite }} --reporter=expanded; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::test/${{ matrix.suite }} on ${{ matrix.os }} failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::test/${{ matrix.suite }} on ${{ matrix.os }} attempt ${attempt} failed — retrying (BUT-1192 infra-flake absorber)"
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-test-results-${{ matrix.os }}
          path: test_results/

      - name: Report job duration
        if: always()
        shell: bash
        env:
          BUDGET_MIN: 30
          JOB_LABEL: "${{ matrix.suite }} (${{ matrix.os }})"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi

  # ── Integration tests (per-commit, ubuntu) ──────────────────────────────
  # Firebase-emulator integration suite. Ubuntu-only already and not a
  # bottleneck, so it stays on the per-commit path unchanged.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Setup Java for Firebase Emulator (firebase-tools requires Java 21+)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version

      - run: flutter pub get

      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi

          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &

          # BUT-489: real health-gate. Wait up to 60s on each emulator port,
          # hard-fail if either never comes up.
          wait_for_port() {
            local name="$1"
            local url="$2"
            local timeout=60
            until curl -sf "$url" >/dev/null 2>&1; do
              sleep 2
              timeout=$((timeout - 2))
              if [ $timeout -le 0 ]; then
                echo "::error::$name emulator failed to come up at $url within 60s"
                exit 1
              fi
            done
            echo "$name emulator ready at $url"
          }
          wait_for_port "Firestore" "http://localhost:8080/"
          wait_for_port "Auth" "http://localhost:9099/"

      # Run integration tests only
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi

      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        run: |
          # Kill all Firebase emulator processes
          pkill -f "firebase" || true

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test_results/

      # BUT-495: emit job duration to step summary + warn if budget exceeded.
      - name: Report job duration
        if: always()
        env:
          BUDGET_MIN: 15
          JOB_LABEL: "Integration Tests"
        run: |
          JOB_END=$(date +%s)
          DURATION_SEC=$((JOB_END - JOB_START))
          DURATION_MIN=$((DURATION_SEC / 60))
          DURATION_REM=$((DURATION_SEC % 60))
          {
            echo "## Build duration"
            echo ""
            echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
            echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
          fi
