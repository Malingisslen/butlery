name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Run unit, widget, and view tests with coverage
      - name: Run unit, widget, and view tests
        run: |
          echo "Running unit, widget, and view tests with coverage..."
          flutter test test/unit test/widget test/views --coverage --reporter=expanded

      # Check coverage threshold
      - name: Check coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            COVERAGE=$(flutter test --coverage 2>/dev/null; lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | grep -oP '[\d.]+%' | head -1 || echo "0%")
            echo "Coverage: $COVERAGE"
          fi

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test_results/
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Setup Java for Firebase Emulator
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      
      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version
      
      - run: flutter pub get
      
      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi
          
          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &
          
          # Wait for emulators to be ready
          sleep 10
          
          # Check if emulators are running
          curl -f http://localhost:8080 || echo "Firestore emulator may not be fully ready"
      
      # Run integration tests only
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi
      
      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        run: |
          # Kill all Firebase emulator processes
          pkill -f "firebase" || true
      
      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test_results/