name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
      
      - run: flutter pub get
      
      # Run unit and widget tests with coverage
      - name: Run unit and widget tests
        run: |
          if [ -n "$(find test/unit test/widget -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running unit and widget tests with coverage..."
            flutter test test/unit test/widget --coverage --reporter=expanded
          else
            echo "No unit/widget tests found, skipping test step"
          fi

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unittests
          name: butlery-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: test_results/
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
      
      # Setup Java for Firebase Emulator
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
      
      # Install Firebase CLI
      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version
      
      - run: flutter pub get
      
      # Start Firebase Emulator
      - name: Start Firebase Emulator
        run: |
          # Create minimal firebase.json if it doesn't exist
          if [ ! -f firebase.json ]; then
            echo '{
              "emulators": {
                "auth": {
                  "port": 9099
                },
                "firestore": {
                  "port": 8080
                },
                "storage": {
                  "port": 9199
                },
                "ui": {
                  "enabled": false
                }
              }
            }' > firebase.json
          fi
          
          # Start emulators in background
          firebase emulators:start --only auth,firestore,storage &
          
          # Wait for emulators to be ready
          sleep 10
          
          # Check if emulators are running
          curl -f http://localhost:8080 || echo "Firestore emulator may not be fully ready"
      
      # Run integration tests only
      - name: Run integration tests
        run: |
          if [ -n "$(find test/integration -name '*.dart' -type f 2>/dev/null)" ]; then
            echo "Running integration tests..."
            flutter test test/integration --reporter=expanded
          else
            echo "No integration tests found, skipping integration test step"
          fi
      
      # Stop Firebase Emulator
      - name: Stop Firebase Emulator
        if: always()
        run: |
          # Kill all Firebase emulator processes
          pkill -f "firebase" || true
      
      # Upload test results if tests fail
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: test_results/