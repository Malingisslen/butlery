name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      
      - run: flutter pub get
      
      # Kör tester endast om test-mappen innehåller .dart filer
      - name: Run tests
        run: |
          if [ -n "$(find test -name '*.dart' -type f 2>/dev/null)" ]; then
            flutter test
          else
            echo "No tests found, skipping test step"
          fi