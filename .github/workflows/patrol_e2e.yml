name: Patrol E2E

# Separate from test.yml so emulator flake doesn't block PRs on the main job.
# This workflow is deliberately allowed to fail without blocking merge —
# Patrol runs on real Android emulators / iOS simulators, and emulator boot
# is inherently flaky on hosted runners. Treat failures as a signal for
# investigation, not as a merge block.
#
# Triggers:
#   - pull_request: run on every PR touching app code, for early signal.
#   - schedule: nightly run at 03:00 UTC, catches environmental drift.
#   - workflow_dispatch: manual re-run from the Actions tab.

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'patrol.yaml'
      - '.github/workflows/patrol_e2e.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  android-patrol:
    name: Android Patrol (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking: first Patrol run on any CI shows shakedown failures.
    # Remove this once we've observed ~5 green runs.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Patrol's CLI is the canonical way to invoke Patrol tests. It wires
      # up the Gradle integration-test task for us.
      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - run: flutter pub get

      # Firebase emulator + Java 21 (firebase-tools requirement). Mirror
      # the same setup used in test.yml's integration-tests job so the
      # Patrol lane exercises the same backend surface.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version

      - name: Start Firebase emulator
        run: |
          firebase emulators:start --only auth,firestore,storage &
          # Wait for Firestore emulator to accept connections.
          for i in {1..30}; do
            if curl -sf http://localhost:8080 >/dev/null 2>&1; then
              echo "Firestore emulator up after ${i}s"
              break
            fi
            sleep 1
          done

      # Enable KVM for hardware-accelerated Android emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD cache — emulator boot is the slow part; caching the pre-booted
      # system image cuts ~5 minutes off warm runs.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run Patrol tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # localhost on the host is 10.0.2.2 inside the Android emulator.
            # main_e2e_emulator.dart hardcodes 'localhost', so we forward
            # host ports into the emulator via adb reverse.
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            adb reverse tcp:9199 tcp:9199
            patrol test \
              --target integration_test/patrol_test.dart \
              --verbose

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-patrol-artifacts
          path: |
            build/patrol/
            build/app/outputs/androidTest-results/
          retention-days: 7

      - name: Stop Firebase emulator
        if: always()
        run: pkill -f "firebase" || true

  ios-patrol:
    name: iOS Patrol (simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - run: flutter pub get

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools@15.13.0
          firebase --version

      - name: Start Firebase emulator
        run: |
          firebase emulators:start --only auth,firestore,storage &
          for i in {1..30}; do
            if curl -sf http://localhost:8080 >/dev/null 2>&1; then
              echo "Firestore emulator up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Boot iOS simulator
        run: |
          # Use whatever iPhone simulator is available on the runner image.
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone 1[456] ' \
            | sed -E 's/.*\(([-A-F0-9]+)\).*/\1/')
          if [ -z "$DEVICE" ]; then
            echo "No compatible iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Booting simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Run Patrol tests on iOS simulator
        run: |
          # iOS simulator shares the host loopback — no port forwarding
          # needed for localhost Firebase emulators.
          patrol test \
            --target integration_test/patrol_test.dart \
            --verbose

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-patrol-artifacts
          path: |
            build/patrol/
            build/ios/
          retention-days: 7

      - name: Stop Firebase emulator
        if: always()
        run: pkill -f "firebase" || true
