# BUT-2425: tests the staging project right after something was deployed to it,
# and records the verdict that the production deploy gate (deploy-firebase.yml,
# job `staging-gate`) reads.
#
# It runs after every green staging deploy of rules (deploy-staging-rules.yml) or
# functions (deploy-firebase.yml with environment=staging). A deploy run that
# went to production never counts: the job asks the triggering run which
# environment it deployed to, so a production deploy cannot mark a revision as
# verified.
#
# The run title carries the revision that was deployed. A red run stays the
# latest verdict until a later green one replaces it. `inject_failure` ends the
# run red on purpose, to prove that the production gate stops on it.
#
# Read-only against staging: reads `system/config` and one count, calls no LLM.
name: Staging Verify

run-name: Staging verify ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [Deploy Firebase, Deploy Staging Rules]
    types: [completed]
  workflow_dispatch:
    inputs:
      inject_failure:
        description: "End red on purpose (proves the production gate stops)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Smoke-test staging
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      INJECT_FAILURE: ${{ inputs.inject_failure && 'true' || 'false' }}

    steps:
      - name: Stop if the triggering deploy did not go to staging
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Deploy Firebase'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}/jobs" --jq '.jobs[].name')
          echo "Jobs of the triggering run: $jobs"
          if ! grep -qx 'Deploy to staging' <<< "$jobs"; then
            echo "::error::The triggering Deploy Firebase run did not deploy to staging, so it verifies nothing."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud (staging WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Guard — target is staging
        env:
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          EXPECTED=$(jq -r '.projects.staging // empty' .firebaserc)
          [ -n "$EXPECTED" ] || fail ".firebaserc has no 'staging' alias."
          [ "$FIREBASE_PROJECT_ID" = "$EXPECTED" ] \
            || fail "vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the staging alias ($EXPECTED)."
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ] \
            || fail "The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'."

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Smoke-test staging
        working-directory: functions
        run: |
          set -euo pipefail
          args=(--project "$FIREBASE_PROJECT_ID")
          if [ "$INJECT_FAILURE" = "true" ]; then args+=(--inject-failure); fi
          node scripts/staging-smoke.js "${args[@]}"
