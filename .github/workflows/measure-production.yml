# BUT-2278, BUT-2260, BUT-2031, BUT-1814 and BUT-2332: read-only measurements against production.
#
# Writes nothing to Firestore or anywhere else in the project. Prints counts
# only, never a uid or a log line's text, because the onUserDeleted error line
# carries the deleted user's uid.
#
# Uses the deploy service account, which lives behind the `production`
# environment.
name: Measure production (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Read-only counts
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret not configured." >&2
            exit 1
          fi
          # The environment's variable, the `.firebaserc` production alias and
          # the key must all name the same project before anything runs.
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::vars.FIREBASE_PROJECT_ID is empty for the production environment." >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$(jq -r '.projects.production // empty' .firebaserc)" ] \
            || { echo "::error::vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the production alias in .firebaserc." >&2; exit 1; }
          [ "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.project_id // empty')" = "$FIREBASE_PROJECT_ID" ] \
            || { echo "::error::The service-account key does not belong to $FIREBASE_PROJECT_ID." >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: "BUT-2278, BUT-2260 and BUT-2332: minor profiles, recipe cache, group owners"
        working-directory: functions
        run: node scripts/measure-launch-risks.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "BUT-2031: onUserDeleted social cleanup failures"
        run: |
          set -uo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          # Only timestamps are read; the message text names the deleted user.
          if out=$(gcloud logging read '"Social cleanup failed for user"' \
                --project "$FIREBASE_PROJECT_ID" --freshness=3650d \
                --format='value(timestamp)' 2>"$RUNNER_TEMP/logging.err"); then
            count=$(printf '%s' "$out" | grep -c . || true)
            oldest=$(gcloud logging read 'resource.labels.function_name="onUserDeleted"' \
                --project "$FIREBASE_PROJECT_ID" --freshness=3650d --order=asc --limit=1 \
                --format='value(timestamp)' 2>/dev/null || true)
            {
              echo "social_cleanup_failures=$count"
              echo "oldest_onUserDeleted_log_entry=${oldest:-none}"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cloud Logging read refused: $(head -c 300 "$RUNNER_TEMP/logging.err")"
            exit 1
          fi

      - name: "BUT-1814: maintenance chain task durations, last 30 days"
        run: |
          set -uo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          # These log lines carry chain, task, durationMs and error codes only.
          if gcloud logging read \
                'jsonPayload.message=("maintenance.task_complete" OR "maintenance.task_failed" OR "maintenance.task_skipped" OR "maintenance.chain_complete")' \
                --project "$FIREBASE_PROJECT_ID" --freshness=30d --limit=20000 \
                --format=json >"$RUNNER_TEMP/chain.json" 2>"$RUNNER_TEMP/logging.err"; then
            jq -r '
              def pct(p): (sort | .[((length - 1) * p | floor)]);
              map(.jsonPayload) as $rows
              | ($rows | map(select(.message == "maintenance.task_complete"))
                 | group_by(.chain + "/" + .task)
                 | map({key: (.[0].chain + "/" + .[0].task),
                        d: map(.durationMs)})
                 | map("\(.key) runs=\(.d | length) p50=\(.d | pct(0.5))ms p95=\(.d | pct(0.95))ms max=\(.d | max)ms")
                 | .[]),
                ($rows | map(select(.message == "maintenance.task_failed"))
                 | map("FAILED \(.chain)/\(.task) timedOut=\(.timedOut) durationMs=\(.durationMs) errCode=\(.errCode)") | .[]),
                ($rows | map(select(.message == "maintenance.task_skipped"))
                 | map("SKIPPED \(.chain)/\(.task) availableMs=\(.availableMs)") | .[]),
                ($rows | map(select(.message == "maintenance.chain_complete"))
                 | group_by(.chain)
                 | map("CHAIN \(.[0].chain) runs=\(length) max=\(map(.durationMs) | max)ms p50=\(map(.durationMs) | pct(0.5))ms")
                 | .[])
            ' "$RUNNER_TEMP/chain.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cloud Logging read refused: $(head -c 300 "$RUNNER_TEMP/logging.err")"
            exit 1
          fi
