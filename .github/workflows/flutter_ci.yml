name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  COVERAGE_THRESHOLD: 90

jobs:
  # Job 1: Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        
      - name: 📝 Check formatting
        run: dart format --set-exit-if-changed .
        
      - name: 🔒 Run very_good_analysis
        run: flutter pub run very_good_cli:very_good analyze
        
      - name: 📊 Upload analysis results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results
          path: |
            .dart_tool/analyzer-results.json
            
  # Job 2: Unit and Widget tests
  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    
    strategy:
      matrix:
        flutter-channel: [stable, beta]
        
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter ${{ matrix.flutter-channel }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.flutter-channel }}
          cache: true
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🧪 Run unit tests
        run: |
          flutter test \
            --coverage \
            --test-randomize-ordering-seed random \
            --reporter expanded \
            test/features/*/unit/
            
      - name: 🧪 Run widget tests
        run: |
          flutter test \
            --coverage \
            --test-randomize-ordering-seed random \
            --reporter expanded \
            test/features/*/widget/
            
      - name: 📊 Generate coverage report
        run: |
          flutter pub global activate coverage
          flutter pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib
            
      - name: 📈 Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info | grep "lines" | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "Current coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "Coverage $COVERAGE% is below threshold $COVERAGE_THRESHOLD%"
            exit 1
          fi
          
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          flags: unittests
          name: flutter-${{ matrix.flutter-channel }}
          
      - name: 💬 Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
  # Job 3: Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    timeout-minutes: 45
    needs: quality
    
    strategy:
      matrix:
        device:
          - "iPhone 14 Pro"
          - "iPad Pro (11-inch)"
          
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: 📱 Start iOS Simulator
        run: |
          xcrun simctl list devices
          DEVICE_ID=$(xcrun simctl list devices | grep "${{ matrix.device }}" | grep -E -o -i "([0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12})" | head -1)
          xcrun simctl boot $DEVICE_ID || true
          xcrun simctl openurl $DEVICE_ID https://flutter.dev
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🧪 Run Patrol tests
        run: |
          flutter pub global activate patrol_cli
          patrol test \
            --target integration_test/app_test.dart \
            --device "${{ matrix.device }}" \
            --flavor development \
            --dart-define=INTEGRATION_TEST=true
            
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results-${{ matrix.device }}
          path: |
            build/reports/
            screenshots/
            
  # Job 4: Golden tests
  golden-tests:
    name: Golden Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🖼️ Run golden tests
        run: |
          flutter test \
            --update-goldens \
            --tags=golden \
            test/golden/
            
      - name: 🔍 Check for golden differences
        run: |
          if [[ $(git diff --name-only | grep -E "\.png$" | wc -l) -gt 0 ]]; then
            echo "Golden files have changed!"
            git diff --name-only | grep -E "\.png$"
            exit 1
          fi
          
      - name: 📤 Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: golden-failures
          path: |
            test/golden/failures/
            
  # Job 5: Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🚀 Build release APK
        run: flutter build apk --release
        
      - name: 📊 Run performance benchmarks
        run: |
          flutter drive \
            --driver=test_driver/performance_test.dart \
            --target=integration_test/performance_test.dart \
            --profile
            
      - name: 📈 Analyze performance results
        run: |
          dart tools/analyze_performance.dart
          
      - name: 📤 Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: build/performance/
          
  # Job 6: Build artifacts
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [unit-tests, integration-tests, golden-tests]
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: Android
            build-cmd: flutter build apk --release --split-per-abi
            artifact-path: build/app/outputs/flutter-apk/*.apk
            
          - os: macos-latest
            target: iOS
            build-cmd: |
              flutter build ios --release --no-codesign
              cd ios && xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release archive -archivePath build/Runner.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
            artifact-path: ios/build/Runner.xcarchive
            
          - os: ubuntu-latest
            target: Web
            build-cmd: flutter build web --release --web-renderer canvaskit
            artifact-path: build/web
            
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: ☕ Setup Java (Android only)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          
      - name: 📦 Get dependencies
        run: flutter pub get
        
      - name: 🏗️ Build ${{ matrix.target }}
        run: ${{ matrix.build-cmd }}
        
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target }}-artifacts
          path: ${{ matrix.artifact-path }}
          
  # Job 7: Deploy (only on main branch)
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📚 Checkout code
        uses: actions/checkout@v4
        
      - name: 📥 Download web artifacts
        uses: actions/download-artifact@v3
        with:
          name: Web-artifacts
          path: build/web
          
      - name: 🔥 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: butlery-prod
          
  # Job 8: Notify results
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, golden-tests, build]
    if: always()
    
    steps:
      - name: 📊 Check job statuses
        id: check
        run: |
          if [[ "${{ needs.quality.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.integration-tests.result }}" == "failure" || \
                "${{ needs.golden-tests.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ steps.check.outputs.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const message = status === 'success' 
              ? 'All tests passed! Ready to merge.' 
              : 'Some tests failed. Please check the logs.';
              
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **CI Status**: ${message}\n\n[View detailed results](${context.payload.pull_request.html_url}/checks)`
            });
            
      - name: 📧 Send notification
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          echo "Build failed on main branch! Sending notifications..."
          # Add your notification logic here (Slack, email, etc.)