# Builds a signed iOS release and uploads it to App Store Connect, where it
# appears under TestFlight for the closed test group (BUT-447).
#
# MANUAL ONLY (workflow_dispatch), behind the `production` environment's
# reviewer gate like deploy-hosting.yml.
#
# Signing: Xcode's automatic signing archives with a development identity, and
# a development profile needs a registered device, which this team does not
# have (BUT-2333). So each run makes its own App Store signing files through
# the App Store Connect API (a fresh key, a distribution certificate and an
# App Store profile) and revokes that certificate when it ends, as Malin chose
# on 2026-10-09. No certificate or profile is stored in the repo or in
# secrets. The key needs the Admin role, because creating a distribution
# certificate is an Admin permission.
#
# Secrets used:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY  App Store Connect API key
#                                               (ASC_PRIVATE_KEY = the whole
#                                               AuthKey_<id>.p8 text)
#   FREE_RASP_TEAM_ID                           Apple team id; a release build
#                                               without it stops at startup
#                                               (device_integrity_service.dart)
#   OCR_API_KEY, OCR_API_URL                    same .env as build-validation.yml
#
# Firebase reads lib/firebase_options.dart, so no GoogleService-Info.plist is
# needed for the build.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type UPLOAD to build the current ref and send it to TestFlight"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  upload:
    runs-on: macos-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Refuse without the confirmation word
        if: inputs.confirm != 'UPLOAD'
        run: |
          echo "::error::Type UPLOAD in the confirm field to build and upload. Nothing was uploaded." >&2
          exit 1

      - name: Refuse without the signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FREE_RASP_TEAM_ID: ${{ secrets.FREE_RASP_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY FREE_RASP_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          ENV=production
          OCR_API_KEY=${{ secrets.OCR_API_KEY }}
          OCR_API_URL=${{ secrets.OCR_API_URL }}
          FREE_RASP_TEAM_ID=${{ secrets.FREE_RASP_TEAM_ID }}
          ENVEOF

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$KEY_PATH" || { echo "::error::ASC_PRIVATE_KEY does not look like a .p8 file (no BEGIN PRIVATE KEY line)." >&2; exit 1; }
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      # --config-only writes the Dart build settings (defines, obfuscation,
      # build number) into Generated.xcconfig; the signed build itself is
      # xcodebuild's, because only xcodebuild accepts the API key.
      # The run number is the build number: App Store Connect refuses a build
      # number it has already seen for the same version.
      - name: Configure the Flutter build
        run: |
          flutter build ios --release --config-only \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define-from-file=.env \
            --build-number=${{ github.run_number }}

      - name: Install the signing tools
        run: pip3 install --break-system-packages codemagic-cli-tools==0.69.1

      # A fresh key means a fresh certificate; the revoke step at the end
      # keeps the team under Apple's limit on distribution certificates.
      # use-profiles switches only the Runner target to manual signing with
      # the new profile, on this runner's checkout.
      - name: Create this run's signing files
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH"
          CERT_KEY="$RUNNER_TEMP/dist_cert_key.pem"
          openssl genrsa -out "$CERT_KEY" 2048
          echo "CERT_KEY=$CERT_KEY" >> "$GITHUB_ENV"
          keychain initialize
          app-store-connect fetch-signing-files se.butlery.app \
            --platform IOS --type IOS_APP_STORE \
            --certificate-key "@file:$CERT_KEY" --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --export-options-plist "$RUNNER_TEMP/export_options.plist" \
            --custom-export-options '{"destination": "upload", "manageAppVersionAndBuildNumber": false, "uploadSymbols": true}'

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/export_options.plist" \
            -exportPath build/ios/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect → TestFlight once Apple has processed it."

      - name: Keep the symbol files
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug-info-${{ github.run_number }}
          path: build/debug-info
          retention-days: 90

      - name: Revoke this run's certificate
        if: always() && env.CERT_KEY != ''
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Through the library, not `certificates list --json`: the CLI prints
        # the team's whole list before filtering it by key, so its JSON would
        # name every distribution certificate, not just this run's.
        run: |
          python3 - <<'PY'
          import os
          from codemagic.apple.app_store_connect import IssuerId, KeyIdentifier
          from codemagic.apple.resources import ProfileType
          from codemagic.models import PrivateKey
          from codemagic.tools import AppStoreConnect

          asc = AppStoreConnect(
              KeyIdentifier(os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]),
              IssuerId(os.environ["APP_STORE_CONNECT_ISSUER_ID"]),
              open(os.environ["ASC_KEY_PATH"]).read(),
          )
          key = PrivateKey.from_buffer(open(os.environ["CERT_KEY"]).read())
          mine = asc.list_certificates(
              profile_type=ProfileType.IOS_APP_STORE,
              certificate_key=key,
              should_print=False,
          )
          if len(mine) > 1:
              raise SystemExit(f"{len(mine)} certificates match this run's new key; revoking none.")
          for certificate in mine:
              asc.delete_certificate(certificate.id)
              print(f"Revoked {certificate.id}")
          PY

      - name: Remove the key files
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/dist_cert_key.pem
