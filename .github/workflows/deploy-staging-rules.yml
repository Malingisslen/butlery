# BUT-451: keeps the staging project's Firestore rules, indexes and Storage
# rules in step with `main`.
#
# It waits for the Firestore Rules suite instead of running on push: a red
# suite must never reach any project, staging included. `workflow_run` fires only after the
# suite finished, and the job only proceeds when it finished green on `main`.
# The suite's own `paths:` decide when that happens, so an edit to
# `firestore.indexes.json` alone does not start it — dispatch this workflow by
# hand for that.
#
# It deploys the commit the suite tested (`head_sha`), not whatever `main`
# points at by the time this job starts.
#
# Functions are not deployed here: they go through deploy-firebase.yml with
# `environment: staging`.
#
# Staging only. Authenticates with Workload Identity Federation; there is no
# stored key, and the guard step refuses to run if the production key is
# readable from this job.
name: Deploy Staging Rules

on:
  workflow_run:
    workflows: [Firestore Rules]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Its own queue, separate from deploy-firebase's staging queue, and never
# cancelled: a cancelled rules deploy can leave rules and indexes from
# different commits.
concurrency:
  group: deploy-staging-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rules, indexes and storage to staging
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && (github.event.workflow_run.event == 'push'
              || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.13.0

      - name: Authenticate to Google Cloud (staging WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Same guard as deploy-firebase.yml's staging branch: the environment's
      # variable, the `.firebaserc` staging alias and the WIF token's project
      # must agree, and the production key must be invisible here.
      - name: Guard — deploy target is staging
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [ -n "$FIREBASE_PROJECT_ID" ] || fail "vars.FIREBASE_PROJECT_ID is empty for the staging environment."
          EXPECTED=$(jq -r '.projects.staging // empty' .firebaserc)
          [ -n "$EXPECTED" ] || fail ".firebaserc has no 'staging' alias."
          [ "$FIREBASE_PROJECT_ID" = "$EXPECTED" ] \
            || fail "vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the staging alias in .firebaserc ($EXPECTED)."
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] \
            || fail "This job can read FIREBASE_SERVICE_ACCOUNT. It must be a production environment secret, not a repository secret."
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ] \
            || fail "The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'."
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID (staging) — guard passed."

      # No `--force`: on `firestore:indexes` it deletes every index and TTL
      # policy missing from the file (functions/RUNBOOK.md).
      - name: Deploy
        run: |
          firebase deploy --only firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT_ID" --non-interactive

      # The CLI does not report whether Firestore accepted a TTL policy.
      - name: List Firestore TTL policies
        run: gcloud firestore fields ttls list --project "$FIREBASE_PROJECT_ID"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging rules deploy"
            echo ""
            echo "- Project: \`${FIREBASE_PROJECT_ID}\`"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
