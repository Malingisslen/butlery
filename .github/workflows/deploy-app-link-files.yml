# Publishes web/.well-known/ (the files that let the "glömt lösenord" link and
# other app links open the app, BUT-2170) on the live `app` Hosting site
# WITHOUT republishing the web app: tools/hosting/patch_live_files.py clones
# the live version and swaps only these files. security.txt (RFC 9116,
# BUT-1522) rides along: it tells security researchers where to report a
# vulnerability. Rollback = re-release the previous version in the Firebase
# console (Hosting → release history).
name: Deploy app link files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would change"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-app-link-files
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate the files
        run: |
          python3 -c "import json; json.load(open('web/.well-known/assetlinks.json')); json.load(open('web/.well-known/apple-app-site-association'))"
          if grep -q REPLACE_ME web/.well-known/assetlinks.json web/.well-known/apple-app-site-association; then
            echo "::error::A placeholder is still in web/.well-known/." >&2
            exit 1
          fi
          # RFC 9116: a security.txt past its Expires date must be treated as
          # stale, so never publish one that already is.
          python3 - <<'PY'
          import datetime, re
          text = open("web/.well-known/security.txt").read()
          assert re.search(r"^Contact: mailto:", text, re.M), "security.txt has no Contact"
          m = re.search(r"^Expires: (\S+)$", text, re.M)
          assert m, "security.txt has no Expires"
          expires = datetime.datetime.fromisoformat(m.group(1).replace("Z", "+00:00"))
          now = datetime.datetime.now(datetime.timezone.utc)
          assert expires > now, f"security.txt expired {m.group(1)}: move Expires forward (at most a year)"
          assert expires <= now + datetime.timedelta(days=366), f"security.txt Expires {m.group(1)} is more than a year out"
          PY

      # Short-lived token from Workload Identity Federation, no stored key.
      # patch_live_files.py takes its access token from gcloud.
      - name: Authenticate to Google Cloud (WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Patch the live site
        env:
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          # The environment's variable, the `.firebaserc` production alias and
          # the WIF token must all name the same project before anything runs.
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::vars.FIREBASE_PROJECT_ID is empty for the production environment." >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$(jq -r '.projects.production // empty' .firebaserc)" ]             || { echo "::error::vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the production alias in .firebaserc." >&2; exit 1; }
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ]             || { echo "::error::The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'." >&2; exit 1; }
          # The `app` hosting target's site, as `firebase deploy` would resolve it.
          SITE=$(jq -r --arg p "$FIREBASE_PROJECT_ID" '.targets[$p].hosting.app[0] // empty' .firebaserc)
          [ -n "$SITE" ] || { echo "::error::no app hosting target for $FIREBASE_PROJECT_ID in .firebaserc" >&2; exit 1; }
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          python3 tools/hosting/patch_live_files.py             --site "$SITE"             ${{ inputs.dry_run && '--dry-run' || '' }}             --headers-from-target app             /.well-known/assetlinks.json=web/.well-known/assetlinks.json             /.well-known/apple-app-site-association=web/.well-known/apple-app-site-association             /.well-known/security.txt=web/.well-known/security.txt

      - name: Check what the site serves
        if: ${{ !inputs.dry_run }}
        run: |
          # A check run in the same second as the release failed while the
          # files were correct minutes later, so give the edge a minute (BUT-2432).
          serves_new_files() {
            curl -fsS "https://$1/.well-known/assetlinks.json" | grep -q D5:5E:2C &&
            curl -fsS "https://$1/.well-known/assetlinks.json" | grep -q B1:D8:B2 &&
            curl -fsS "https://$1/.well-known/apple-app-site-association" | grep -q F6SFW9MP8T &&
            curl -fsS "https://$1/.well-known/security.txt" | grep -q "^Contact: mailto:security@butlery.se" &&
            curl -fsSI "https://$1/" | grep -i "^content-security-policy:" | grep -q "https://apis.google.com"
          }
          for host in "$SITE.firebaseapp.com" "$SITE.web.app"; do
            for attempt in 1 2 3 4 5 6; do
              serves_new_files "$host" && break
              [ "$attempt" = 6 ] && { echo "::error::$host still serves old files after 60 s" >&2; exit 1; }
              sleep 10
            done
            echo "$host serves the new files"
          done
