name: LLM Golden Tests

# BUT-784 — closed-loop LLM quality measurement.
#
# Runs nightly (not per-PR — full corpora call paid Vertex AI / Mistral APIs
# and take minutes). Failures don't block merges; they emit a Crashlytics
# non-fatal event and post a summary issue comment for triage.
#
# Foundation only: per-corpus model wiring is per-corpus follow-up tickets.
# This workflow exists so the schedule + the cost-guard plumbing are in
# place before the corpora ship.

on:
  schedule:
    # 03:17 UTC = 04:17 / 05:17 Stockholm time. Off-peak avoids contending
    # with the morning push of `Run Tests`.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Specific corpus to run (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - categorize_ingredient
          - ner
          - recipe_from_url
          - ocr_recipe
          - enhance_recipe
          - generate_menu

env:
  FLUTTER_VERSION: '3.38.5'
  # Hard cost cap per nightly run. Failure here means a prompt change
  # silently increased token usage; investigate before re-running.
  COST_CAP_USD: '1.00'

jobs:
  golden-llm:
    name: LLM golden corpus (${{ inputs.corpus || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation to Vertex AI

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # BUT-888: on-device runners are wired (categorize_ingredient runs
      # for real; ner emits a skip artifact — see the BUT-1005 note below).
      # BUT-889 / BUT-1006-1008: paid-API corpora still pending.
      - name: Run golden corpora
        id: run
        run: |
          set -e
          echo "Running LLM goldens"
          echo "Cost cap: \$${COST_CAP_USD}"
          if [ ! -d test/golden/llm ]; then
            echo "No test/golden/llm/ — skipping"
            exit 0
          fi

          corpus_filter='${{ inputs.corpus || 'all' }}'

          case "$corpus_filter" in
            all|categorize_ingredient|ner|recipe_from_url) ;;
            ocr_recipe|enhance_recipe|generate_menu)
              echo "::warning::Corpus '$corpus_filter' is wired in the dispatch dropdown but not yet implemented (BUT-889 / BUT-1006-1008). Skipping."
              exit 0
              ;;
            *)
              echo "::error::Unknown corpus filter: $corpus_filter"
              exit 1
              ;;
          esac

          if [ "$corpus_filter" = "all" ] || [ "$corpus_filter" = "categorize_ingredient" ]; then
            echo "▶ categorize_ingredient"
            flutter test test/golden/llm/categorize_ingredient_test.dart
          fi

          # BUT-1005: the ner corpus CANNOT produce real signal in this job —
          # flutter_onnxruntime is a platform-channel plugin, and `flutter test`
          # runs a headless VM with no plugin registrants, so inference throws
          # MissingPluginException even if the model file were bundled or
          # downloaded here. The run below executes only the skip-artifact
          # companion test, which emits goldens-ner.json marking the corpus
          # skipped. Real signal requires an integration_test lane on a
          # device-capable runner (follow-up filed from BUT-1005).
          if [ "$corpus_filter" = "all" ] || [ "$corpus_filter" = "ner" ]; then
            echo "▶ ner (emits skip artifact — cannot run under flutter test, see BUT-1005)"
            flutter test test/golden/llm/ner_test.dart
          fi

          # BUT-2239: the paid corpus. The Dart step only builds the inputs;
          # the calls run in the next step, and only with cloud access.
          if [ "$corpus_filter" = "all" ] || [ "$corpus_filter" = "recipe_from_url" ]; then
            echo "▶ recipe_from_url inputs"
            flutter test test/golden/llm/recipe_from_url_inputs_test.dart
            echo "recipe_from_url=true" >> "$GITHUB_OUTPUT"
          fi

      # Live only once the repository variables naming a Workload Identity
      # provider and service account exist; until then the script writes a
      # "skipped" summary and calls nothing.
      - name: Authenticate to Google Cloud
        if: steps.run.outputs.recipe_from_url == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GOLDEN_SERVICE_ACCOUNT }}

      - name: Run recipe_from_url corpus
        if: steps.run.outputs.recipe_from_url == 'true'
        working-directory: functions
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_PROJECT_ID || '' }}
        run: |
          npm ci
          npx ts-node src/admin/golden-recipe-from-url.ts \
            ../build/golden-llm/recipe_from_url_inputs.json \
            ../goldens-recipe_from_url.json

      - name: Cost guard
        if: always()
        run: |
          # Sums total_cost_usd across every corpus summary that carries one.
          shopt -s nullglob
          files=(goldens-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No corpus summaries"
            exit 0
          fi
          total=$(jq -s '[.[] | .total_cost_usd? // 0] | add' "${files[@]}")
          echo "Total cost: \$${total} (cap \$${COST_CAP_USD})"
          if [ "$(jq -n --argjson t "$total" --argjson c "$COST_CAP_USD" '$t > $c')" = "true" ]; then
            echo "::error::LLM goldens cost \$${total}, over the \$${COST_CAP_USD} cap"
            exit 1
          fi

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-llm-summary-${{ github.run_id }}
          path: |
            goldens-*.json
          if-no-files-found: ignore

      - name: Post regression comment
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            // Open an issue on regression so the operator gets pinged.
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `LLM goldens regressed on ${context.runId}`,
              body: `See workflow run https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['llm-regression', 'automation'],
            });
