name: Adoption Status Nightly

# BUT-825: nightly refresh of docs/architecture/adoption-status.md.
#
# `tools/measure_adoption.dart` derives BaseService / BaseFirebaseRepository /
# BaseViewModel adoption percentages from the codebase. Inline percentages in
# prompt + analysis docs are forbidden by BUT-776's guard; the source of truth
# is this auto-generated file. A nightly run keeps it fresh without manual
# intervention.
#
# The job commits with the sentinel "chore(adoption): nightly refresh" so the
# BUT-776 inline-% guard can treat these commits as canonical.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adoption-status-nightly
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Run measure_adoption tool
        run: dart run tools/measure_adoption.dart

      - name: Commit if changed
        run: |
          if ! git diff --quiet docs/architecture/adoption-status.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/architecture/adoption-status.md
            git commit -F - <<'MSG'
          chore(adoption): nightly refresh

          Auto-generated by tools/measure_adoption.dart per BUT-825.
          Inline % drift in prompts/docs is forbidden by BUT-776 guard — this
          file is the canonical source for adoption metrics.
          MSG
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No adoption drift since last refresh — no commit needed."
          fi
