name: Text integrity

# Two guards over the checked-out tree, both checkout + grep only — no Flutter,
# no Node, no toolchain — so they cost seconds and run on EVERY push and PR.
#
# WHY THIS IS ITS OWN WORKFLOW, and it is the whole point (BUT-1901).
# These steps lived in `test.yml`, whose `on:` carries a `paths-ignore` for
# `**.md`, `docs/**`, `tasks/**`, `.claude/**` and `memory/**`. The commit that
# motivated the second guard — 58bae2954, 2026-07-04, which wrote a literal
# 0x08 into a file a commit gate reads — touched ONLY `.claude/agents/*.md`.
# Every path it changed was ignored, so the guard could not have fired on the
# exact event it was built for. A nightly cron would have caught the class
# within a day, detached from its commit.
#
# So: NO `paths-ignore` here, deliberately. Same shape as `secret-scan.yml`,
# and for the same reason — a guard that skips the directories where the
# problem happens is not a guard.

on:
  push:
  pull_request:

jobs:
  # ── Text-integrity guard (BUT-1624, widened by BUT-1901) ─────────────
  # Two steps, two failure modes, one cheap job (checkout + grep, no Flutter
  # toolchain, so it runs on every push/PR).
  #
  # Step 1 — BUT-1624. A data-writing Cloud Function once landed as a git
  # BINARY blob: a NUL (\0) byte used as a Map-key separator made the whole file
  # undiffable and unreviewable, and it slipped a code review because no diff
  # could render. Source under functions/src/ must always be diffable text.
  #
  # Step 2 — BUT-1901. NUL is not the only byte that does this, and
  # functions/src is not the only place it lands. On 2026-08-19 four literal
  # 0x08 bytes were written into Dart comments by Python heredocs, and a
  # corrupted Windows path had been sitting unreadable in .claude/ since
  # 2026-06-14 (BUT-1902). Step 1 could see none of them: wrong byte, wrong
  # path, wrong extension. Step 2 is the general case.
  #
  # The job id stays `functions-binary-guard` on purpose — three dated entries
  # in .claude/agents/*.knowledge.archive.md name it, and renaming it would
  # strand them. It moved OUT of test.yml on 2026-08-19 (see the header); the
  # id survived the move for the same reason.
  functions-binary-guard:
    name: binary + control-character guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail on any NUL-containing (binary) file under functions/src
        shell: bash
        run: |
          # -a: scan files grep would otherwise treat as binary; -l: list names.
          # Capture into a var so xargs splitting a large file list can't mask a
          # hit (a per-invocation grep exit code would otherwise be swallowed).
          matches="$(git ls-files -z 'functions/src/**' \
            | xargs -0 -r grep -laP '\x00' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Binary (NUL-containing) file(s) under functions/src/ — source must be diffable text:"
            echo "$matches"
            exit 1
          fi
          echo "No binary files under functions/src/."

      - name: Fail on stray control characters in tracked source and docs
        shell: bash
        run: |
          # The class is everything a compiler ignores and a reader cannot see:
          # C0 controls and DEL, MINUS tab (0x09), newline (0x0A) and carriage
          # return (0x0D), which are legal. Same class as
          # lib/services/parsing/sanitizers/html_sanitizer.dart.
          #
          # 0x0B and 0x0C earn their place: a `\v` or `\f` eaten by an escaping
          # layer lands as one of those, and a narrower [\x00-\x08] sees neither.
          # Measured 2026-08-19 against the four escapes the known corruption
          # actually ate.
          #
          # Tab is deliberately OUT, and that is a real hole rather than an
          # oversight: a tab is legal, so `C:\tools` mangled to `C:<TAB>ools` is
          # invisible here and always will be. Only a reader catches that one.
          #
          # Extension-scoped because PNG goldens and other tracked binaries
          # would otherwise match everything. The single exclusion is a test
          # whose fixtures ARE control characters, deliberately and with a
          # comment saying so; excluding the file rather than filtering the
          # results keeps this readable, at the cost of not guarding that file.
          #
          # `|| true` plus the variable: same reason as the step above.
          matches="$(git ls-files -z \
            -- '*.dart' '*.ts' '*.md' '*.yml' '*.yaml' '*.json' '*.js' '*.mjs' \
               '*.sh' '*.arb' '*.xml' '*.plist' \
               ':!test/unit/services/ocr_extraction_service_test.dart' \
            | xargs -0 -r grep -laP '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Stray control character(s) in tracked text. They are invisible to the compiler and to a diff, so a comment or a path can read as broken while every test passes. Usually an escape eaten by an editing layer — see the heredoc entry in tasks/lessons.md:"
            echo "$matches"
            exit 1
          fi
          echo "No stray control characters in tracked source or docs."
