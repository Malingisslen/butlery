name: Cloud Functions Unit Tests

# BUT-1392: Gates pushes that touch functions/src/ behind the full CF unit-test
# suite. Tests run WITHOUT the Firebase emulator — all suites are DI-seam
# (pure TypeScript with injected fakes). Emulator-bound tests (test:rules:* and
# test:integration:*) are handled by the Firestore Rules workflow.
#
# Node version: 22 (matches functions/package.json engines.node and firebase.json
# functions.runtime = "nodejs22").

on:
  push:
    branches: [main]
    paths:
      - "functions/src/**"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/tsconfig.json"
      - "functions/scripts/**"
      - ".github/workflows/cloud-functions-unit.yml"
      # BUT-1675: the test-registration guard reads the rules workflow's
      # `paths:` triggers, so an edit there must re-run this job.
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "functions/src/**"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/tsconfig.json"
      - "functions/scripts/**"
      - ".github/workflows/cloud-functions-unit.yml"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: CF unit tests (Node 22, no emulator)
    runs-on: ubuntu-latest
    # Build + 47 suites measured locally at ~102s. 10 min is generous headroom
    # for a cold npm ci + tsc on a fresh runner.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      # BUT-1675: fails BEFORE the suites run if a test file is registered
      # nowhere, is registered but reachable by no CI lane, or is missing from
      # the rules workflow's `paths:` triggers. A green suite list proves
      # nothing if the list itself silently lost an entry.
      #
      # BUT-1709: the guard's own criteria are proven by
      # `test:script-test-registration` (and the rules-coverage gate's by
      # `test:script-coverage-report`), which the DI-seam step below discovers
      # like any other unit suite — deliberately the same lane the guard's
      # CI_REACHABLE criterion models.
      #
      # BUT-1740: and that only holds because the guard's GUARD_SELF criterion
      # now checks those two script entries. Before it existed, deleting both
      # from functions/package.json left this step printing OK, exit 0, with
      # neither guard suite running — the claim above was true of the intent and
      # false of the mechanism.
      - name: Check test registration
        working-directory: functions
        run: node scripts/check-test-registration.js

      - name: Build TypeScript
        working-directory: functions
        run: npm run build

      # run-ci-unit-tests.js excludes two suites with pre-existing failures on
      # main (test:app-check-enforcement, test:request-account-deletion). Both
      # are documented inside the script with the exact fix needed. Remove the
      # exclusion once each suite is fixed.
      - name: Run DI-seam unit tests
        working-directory: functions
        run: node scripts/run-ci-unit-tests.js
