# BUT-486: Firebase deploy CI.
#
# Deploys Firestore rules + indexes, Cloud Functions, and Storage rules to the
# project named by the chosen GitHub Environment's `FIREBASE_PROJECT_ID`
# variable. Runs on manual dispatch with a selectable target and environment
# (`production` or `staging`). Hosting is intentionally NOT deployed here — the web apps
# (`app` → build/web, `admin` → build/web-admin) need a Flutter build first and
# deploy via their own pipeline.
#
# Staging first, then production: docs/ops/staging.md.
#
# ─── ONE-TIME USER SETUP ─────────────────────────────────────────────────────
#
# `production` GitHub Environment (the manual-approval gate):
# repo Settings → Environments → New environment → name it `production`.
# Under "Deployment protection rules" enable "Required reviewers" and add
# yourself. Every deploy then pauses for your approval before running.
#
# Both environments sign in with Workload Identity Federation: short-lived
# tokens, no stored key (BUT-2421). Each environment holds the variables
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT.
#
# Every project id below comes from `vars.FIREBASE_PROJECT_ID`, never a
# literal: the environment decides the project, and the guard step refuses a
# run where the variable, `.firebaserc` and the credential disagree.
# `functions/src/__tests__/deploy-project-guard.test.ts` refuses a literal.
name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        default: all
        # `verify` deploys nothing: it proves the sign-in and the guard, and reads
        # the project back (the first dispatch against a new project, BUT-2427).
        options: [all, rules, indexes, functions, storage, verify]
      environment:
        description: "Which project to deploy to"
        type: choice
        default: production
        options: [production, staging]
      # Deploying every function at once FAILS on this project: Cloud Run reports
      # "Quota exceeded for total allowable CPU per project per region" for
      # europe-west1.
      #
      # The damage is REAL, and larger than the CLI's closing summary suggests.
      # Run 33043254433 printed a per-service "Could not create or update Cloud
      # Run service <name>, Container Healthcheck failed … Quota exceeded" line
      # for 52 distinct services and then SUMMARISED two. An earlier version of
      # this comment was written from that summary and called the other 50
      # collateral; they were not. COUNT THE PER-SERVICE LINES, never the
      # summary — 52 minus the two later repaired one-at-a-time is exactly the
      # 50 services measured stuck at `Ready=False` afterwards, each still
      # serving its previous revision while its newest one failed.
      #
      # So a targeted deploy is the normal path here, not the exception. Names
      # are function EXPORTS, comma-separated, no `functions:` prefix.
      functions_only:
        description: "Comma-separated function names (blank = all functions)"
        type: string
        default: ""

permissions:
  contents: read

# One queue per PROJECT, not per ref. Never cancel a running deploy —
# a cancelled one is the half-applied state the timeout note below describes
# (BUT-2418).
concurrency:
  group: deploy-firebase-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    # `production` is the manual-approval gate: configure required reviewers on
    # this GitHub Environment so deploys pause until approved.
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    # 90 MINUTES, not the usual 30. A targeted deploy runs ONE
    # `firebase deploy` per name — measured at ~90s each on run 33044537911 —
    # so clearing a backlog of fifty would pass 30 minutes and be CANCELLED
    # mid-run. A cancelled job is not a failed one: nothing downstream flags it,
    # and it leaves exactly the half-applied state this file exists to avoid.
    timeout-minutes: 90

    env:
      DEPLOY_TARGET: ${{ github.event.inputs.target || 'all' }}
      FUNCTIONS_ONLY: ${{ github.event.inputs.functions_only || '' }}
      DEPLOY_ENV: ${{ inputs.environment || 'production' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # 'true' while a NEW project is first filled (BUT-2427): its functions go
      # in over many runs, the smoke gate is red until the last batch, and an
      # auto-rollback or a retire loop would act on a half-built project.
      # Removed from the environment after the first fully green smoke gate.
      BRING_UP: ${{ vars.BRING_UP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history so the rollback step can resolve the previous
          # committed config (HEAD^) to re-release on failure.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # firebase-tools requires Java 21+ for the Firestore/Storage emulators
      # used by the pre-deploy rules gate.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.13.0

      # Short-lived token, no stored key. The action exports
      # GOOGLE_APPLICATION_CREDENTIALS for firebase and
      # CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE for gcloud.
      - name: Authenticate to Google Cloud (WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Before anything can write to a project. Three sources name the target and
      # all must agree: the environment's variable, the `.firebaserc` alias for
      # the environment, and the WIF token's project. Staging additionally
      # asserts it cannot see the old production key — if it can, the key is a
      # repository secret again and every job in the repo holds it. Only the
      # staging run reads that secret at all.
      - name: Guard — deploy target matches the environment
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.environment == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [ -n "$FIREBASE_PROJECT_ID" ] || fail "vars.FIREBASE_PROJECT_ID is empty for environment '$DEPLOY_ENV'."
          EXPECTED=$(jq -r --arg e "$DEPLOY_ENV" '.projects[$e] // empty' .firebaserc)
          [ -n "$EXPECTED" ] || fail ".firebaserc has no '$DEPLOY_ENV' alias."
          [ "$FIREBASE_PROJECT_ID" = "$EXPECTED" ] \
            || fail "vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the '$DEPLOY_ENV' alias in .firebaserc ($EXPECTED)."
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ] \
            || fail "The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'."
          case "$DEPLOY_ENV" in
            production) ;;
            staging)
              [ -z "$FIREBASE_SERVICE_ACCOUNT" ] \
                || fail "The staging job can read FIREBASE_SERVICE_ACCOUNT. It must be a production environment secret, not a repository secret."
              ;;
            *) fail "Unknown environment '$DEPLOY_ENV'." ;;
          esac
          echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID ($DEPLOY_ENV) — guard passed."

      # Pre-deploy gate: only run the rules-unit-testing suite when rules are in
      # scope (target rules or all). If the suite fails the job stops here, so a
      # broken ruleset is never deployed.
      - name: Install function deps
        if: env.DEPLOY_TARGET == 'rules' || env.DEPLOY_TARGET == 'all'
        working-directory: functions
        run: npm ci

      - name: Start Firestore + Storage emulators
        if: env.DEPLOY_TARGET == 'rules' || env.DEPLOY_TARGET == 'all'
        run: |
          firebase emulators:start --only firestore,storage --project demo-test &
          echo "Waiting for Firestore emulator on 127.0.0.1:8080..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "Firestore emulator is up."
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080 >/dev/null
          echo "Waiting for Storage emulator on 127.0.0.1:9199..."
          for i in $(seq 1 60); do
            # Storage emulator answers 501 to a bare GET — any HTTP response
            # proves the port is live, so check connectivity not a 2xx.
            if curl -s -o /dev/null http://127.0.0.1:9199 2>/dev/null; then
              echo "Storage emulator is up."
              break
            fi
            sleep 1
          done

      - name: Run rules unit tests (pre-deploy gate)
        if: env.DEPLOY_TARGET == 'rules' || env.DEPLOY_TARGET == 'all'
        working-directory: functions
        run: npm run test:rules:all

      - name: Stop emulators
        if: always()
        run: pkill -f "firebase" || true

      # ─── PRE-DEPLOY STATE CAPTURE (BUT-1424 rollback baseline) ────────────────
      #
      # Records what we are about to overwrite so a failed deploy can be reverted
      # and a human has the prior state for forensics. This step is READ-ONLY and
      # never fails the job — a capture hiccup must not block a legitimate deploy.
      #
      # The functions rollback target is the LIVE Cloud Run revision map (gen2
      # functions are Cloud Run services). Capturing name→latestReadyRevision here
      # means rollback can traffic-swap back to the exact prior revision without
      # guessing service names or rebuilding old source (the rebuild path can fail
      # independently mid-incident — see BUT-1424 DevOps/SRE review).
      - name: Capture pre-deploy state (rollback baseline)
        id: capture
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -uo pipefail
          PROJECT="$FIREBASE_PROJECT_ID"
          REGION=europe-west1
          mkdir -p rollback-baseline

          gcloud config set project "$PROJECT" >/dev/null 2>&1 || true

          # 1. Cloud Run revision map — ground-truth functions rollback target.
          if [ "$DEPLOY_TARGET" = "functions" ] || [ "$DEPLOY_TARGET" = "all" ]; then
            gcloud run services list --region "$REGION" \
              --format='csv[no-heading](metadata.name,status.latestReadyRevisionName)' \
              > rollback-baseline/cloud-run-revisions.csv 2>/dev/null \
              || echo "::warning::Could not list Cloud Run services — functions rollback baseline empty"
            firebase functions:list --project "$PROJECT" --json \
              > rollback-baseline/functions-pre-deploy.json 2>&1 || true
          fi

          # 2. Snapshot the config files being replaced (forensics).
          cp -f firestore.rules firestore.indexes.json storage.rules rollback-baseline/ 2>/dev/null || true

          # 3. Resolve the previous-good source ref for config rollback: HEAD^ is
          #    the previous committed config.
          PREV_REF=$(git rev-parse --verify -q "HEAD^" || echo "")
          echo "PREV_DEPLOY_REF=$PREV_REF" >> "$GITHUB_ENV"
          echo "$PREV_REF" > rollback-baseline/previous-good-ref.txt
          echo "Captured pre-deploy baseline. Previous config ref: ${PREV_REF:-<none>}"

      # Deploy by target. `--non-interactive` keeps the CLI from prompting.
      # `all` deploys firestore (rules + indexes), functions, and storage — but
      # NOT hosting (hosting needs a web build and deploys separately). The `all`
      # path deploys sub-targets sequentially and records each one it COMPLETES in
      # reached-targets.txt, so the rollback step knows exactly how far it got.
      # Merging the analytics onSchedule jobs into three dispatcher
      # chains REMOVES 14 exports that are live in production. firebase-tools
      # `promptForFunctionDeletion` throws when `nonInteractive && !force` and the
      # plan holds functions to delete, and it is called from `release/index.js`
      # BEFORE any endpoint is created or updated — so the functions deploy would
      # abort having applied nothing, `set -euo pipefail` would fail the step, and
      # the rollback path would fire on a perfectly good build.
      #
      # Deliberately NOT solved with a blanket `--force` on the deploy itself:
      # that would turn every future accidental export removal into a silent
      # production deletion. This list is explicit, named and one-shot.
      #
      # Order matters for a reason beyond the abort. `sendWeeklyActivityDigest`
      # and the new `weeklyReports` chain both run Mon 08:00 UTC and both send
      # the weekly digest push, with no dedup handle — so if both are live for a
      # day, users get it twice. Delete first, deploy second.
      #
      # `|| true` keeps it idempotent: after the first successful run every name
      # is already gone and `functions:delete` exits non-zero on a miss.
      #
      # Production only. The list is a record of what production once ran; a
      # `--force` delete loop has no business in any other project.
      - name: Retire the merged scheduler functions and finished one-shots (idempotent)
        if: env.DEPLOY_ENV == 'production' && env.BRING_UP != 'true' && (env.DEPLOY_TARGET == 'functions' || env.DEPLOY_TARGET == 'all')
        run: |
          set -uo pipefail
          for f in detectLapsedUsers sendWeeklyActivityDigest trackDayNRetention \
                   computeFeatureRetention snapshotImportHealthDaily \
                   snapshotRecipesDaily snapshotParsingCorrectionsDaily \
                   snapshotOpsDaily snapshotFeedbackDaily detectAnomalies \
                   correlateNotificationEffectiveness northStarWeekly \
                   drainRatingAggregations drainPooledRatingAggregations \
                   cleanupExpiredCache backfillSharedListContributors; do
            echo "Retiring $f (no-op if already gone)"
            firebase functions:delete "$f" \
              --region europe-west1 \
              --project "$FIREBASE_PROJECT_ID" \
              --force || true
          done

      - name: Deploy
        id: deploy
        env:
          FEEDBACK_EMAIL_TO: ${{ secrets.FEEDBACK_EMAIL_TO }}
          FEEDBACK_EMAIL_FROM: ${{ secrets.FEEDBACK_EMAIL_FROM }}
          FEEDBACK_DASHBOARD_URL: ${{ secrets.FEEDBACK_DASHBOARD_URL }}
        run: |
          set -euo pipefail
          PROJECT="$FIREBASE_PROJECT_ID"
          : > reached-targets.txt
          # The functions read these from `functions/.env.<project>`, which is
          # gitignored and so absent in CI. Without it `onFeedbackCreated` skips
          # every mail and logs only at info level (BUT-2420).
          write_functions_env() {
            local k v
            for k in FEEDBACK_EMAIL_TO FEEDBACK_EMAIL_FROM; do
              [ -n "${!k}" ] || { echo "::error::Environment secret $k is empty for '$DEPLOY_ENV'." >&2; exit 1; }
            done
            : > "functions/.env.$PROJECT"
            for k in FEEDBACK_EMAIL_TO FEEDBACK_EMAIL_FROM FEEDBACK_DASHBOARD_URL; do
              v="${!k}"
              [ -n "$v" ] || continue
              case "$v" in *$'\n'*) echo "::error::$k holds a newline." >&2; exit 1 ;; esac
              printf '%s=%s\n' "$k" "$v" >> "functions/.env.$PROJECT"
            done
            echo "Wrote functions/.env.$PROJECT with keys: $(cut -d= -f1 "functions/.env.$PROJECT" | tr '\n' ' ')"
          }
          deploy_one() {
            local t="$1"
            case "$t" in functions*) write_functions_env ;; esac
            echo "Deploying: $t"
            # `--force` is REQUIRED, not convenience. The CLI refuses to deploy a
            # codebase containing ANY function with a failure policy unless it is
            # passed, and this one has vetted ones: `onIngredientPropertiesChanged`
            # and `onIngredientSoftDeleted` carry `retry: true` deliberately
            # (BUT-1781 — the update is idempotent, an event-age guard bounds the
            # retry window, and `concurrency: 1` stops the re-delivery packing that
            # OOMs a shared container). Without it this workflow cannot deploy
            # functions at all; that is how it failed on its first ever run.
            #
            # WHAT IT COSTS, because `--force` skips EVERY prompt and not only that
            # one: a function live in production but absent from source is DELETED
            # without asking. Measured on the run that needed the flag — 72 source
            # exports against 71 deployed, the only delta an ADDITION
            # (`ensureCategoryChat`) — so nothing was at risk that day. That is a
            # fact about one deploy, not a standing guarantee, and nothing here
            # re-measures it. A pre-deploy diff that refuses rather than deletes is
            # owed; until it exists, read the CLI's own deletion list in the log.
            firebase deploy --only "$t" --project "$PROJECT" --non-interactive --force
            echo "$t" >> reached-targets.txt
          }
          echo "Deploying target: $DEPLOY_TARGET"
          case "$DEPLOY_TARGET" in
            rules)    deploy_one "firestore:rules" ;;
            indexes)  deploy_one "firestore:indexes" ;;
            functions)
              # Blank input keeps the old whole-codebase behaviour.
              #
              # A list deploys ONE FUNCTION PER `firebase deploy`, sequentially,
              # and the reason is a measured ceiling rather than caution.
              # MEASURED: `run.googleapis.com/CpuAllocPerProjectRegion` is 20000
              # milli vCPU (20 vCPU) for europe-west1 on this project, and a
              # two-function deploy failed on it — run 33043799598, both
              # revisions "Container Healthcheck failed. Quota exceeded".
              # HOW the quota is accounted is not established — see the note in
              # `functions/src/index.ts`, which also says not to write a "how
              # many fit per deploy" number anywhere. That is why this is one
              # function per `firebase deploy` rather than a batch sized from a
              # guess.
              # A quota increase is not currently an option either — the API
              # reports `ineligibilityReason: NOT_ENOUGH_USAGE_HISTORY`.
              #
              # Sequential deploys can half-finish, which one `--only` could not.
              # That is bought off BEFORE anything ships: every name is checked
              # first, so a typo fails the run while production is untouched.
              #
              # Checked against `functions/src/index.ts` and NOT the compiled
              # `functions/lib/index.js`: the build runs as firebase's own
              # predeploy hook, i.e. inside the first `deploy_one`, so `lib/`
              # does not exist yet at this point in a clean CI checkout. Reading
              # it here would report every name as missing.
              if [ -n "${FUNCTIONS_ONLY// /}" ]; then
                names=$(echo "$FUNCTIONS_ONLY" | tr -d ' ' | tr ',' '\n' | grep -v '^$')
                missing=""
                for n in $names; do
                  grep -qE "(^|[^A-Za-z0-9_])$n([^A-Za-z0-9_]|$)" functions/src/index.ts \
                    || missing="$missing $n"
                done
                if [ -n "$missing" ]; then
                  echo "::error::Not exported by functions/src/index.ts:$missing" >&2
                  exit 1
                fi
                for n in $names; do deploy_one "functions:$n"; done
              else
                deploy_one "functions"
              fi
              ;;
            storage)  deploy_one "storage" ;;
            verify)
              gcloud projects describe "$PROJECT" --format="value(projectId,projectNumber,lifecycleState)"
              ;;
            all)
              deploy_one "firestore"
              deploy_one "functions"
              deploy_one "storage"
              ;;
            *)
              echo "::error::Unknown deploy target '$DEPLOY_TARGET'" >&2
              exit 1
              ;;
          esac

      # ─── POST-DEPLOY SMOKE GATE ───────────────────────────────────────────────
      #
      # PURPOSE: catch the "firebase deploy said OK but the function is broken"
      # class of regression. The CLI exit-0 does NOT guarantee functions are
      # callable — a bad build or a runtime-config error can leave functions in
      # a DEPLOY_FAILED state on the backend while the CLI still exits cleanly.
      #
      # WHAT WE CHECK:
      #   1. `firebase functions:list` — queries the Cloud Functions control plane
      #      and returns the deployed function manifest. We assert that a
      #      representative set of core functions (spanning all families) appears
      #      in the output. If any is missing, exit 1 fails the workflow loudly.
      #
      # WHY THESE SPECIFIC FUNCTIONS:
      #   - structureRecipe / ocrRecipeImage  — LLM callables, most expensive cold
      #     start; if they vanished the core import flow is dead.
      #   - sendNotification                  — notifications family anchor.
      #   - onUserDeleted                     — GDPR cascade; critical correctness.
      #   - verifySignupAge                   — ADR-0002 age-gate; gates UGC paths.
      #   - requestAccountDeletion            — account family; GDPR Article 17.
      #   - cleanupOldAuditLogs               — cleanup scheduler anchor.
      #   - drainRatingAggregations           — rating aggregation scheduler anchor.
      #   (Migration function backfillRecipeCommentsDenorm deliberately excluded —
      #    it is lifecycle-bound and may be removed; checking it would cause false
      #    fails after planned removal.)
      #
      # FAIL-SAFE CONTRACT:
      #   - The step only runs when functions were in scope (target 'functions' or
      #     'all'). Rules-only or index-only deploys skip it.
      #   - `firebase functions:list` itself failing (network error, auth error,
      #     unexpected CLI error) causes a non-zero exit → workflow fails. This is
      #     intentional: a check that silently swallows errors would be worse than
      #     no check at all (fail-safe over fail-open).
      #   - `set -euo pipefail` ensures any intermediate command failure propagates.
      #   - GOOGLE_APPLICATION_CREDENTIALS is already set by the Authenticate step;
      #     no new secrets are needed.
      #
      # NO NEW INFRASTRUCTURE: no callables are invoked, no data is written, no
      # new secrets or resources are required. This purely queries the control plane.
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Post-deploy smoke gate (functions presence check)
        id: smoke
        if: env.DEPLOY_TARGET == 'functions' || env.DEPLOY_TARGET == 'all'
        env:
          # Reuse the ADC credential written by the Authenticate step above.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -euo pipefail
          PROJECT="$FIREBASE_PROJECT_ID"

          # Core functions that MUST be present after every functions deploy.
          # These span every major family so a wholesale or partial failure is caught.
          REQUIRED_FUNCTIONS=(
            "structureRecipe"
            "ocrRecipeImage"
            "sendNotification"
            "onUserDeleted"
            "verifySignupAge"
            "requestAccountDeletion"
            "scheduleAccountDeletion"
            "cancelAccountDeletion"
            "runDueAccountDeletions"
            "cleanupOldAuditLogs"
            # Was "drainRatingAggregations" until the scheduler merge: the two
            # rating drains and the ten daily analytics jobs now run inside
            # `drainAggregations` / `dailyAnalytics` (one Cloud Scheduler job per
            # chain instead of one per job). A stale name here fails the smoke
            # gate and triggers the BUT-1424 auto-rollback of a good deploy.
            "drainAggregations"
            "dailyAnalytics"
          )

          # Control-plane lag: a freshly-deployed function can take 15-30s to appear
          # in functions:list. Settle first, then check with one retry. This avoids a
          # FALSE-POSITIVE smoke failure which — now that rollback is wired — would
          # otherwise revert a perfectly good deploy (BUT-1424 DevOps/SRE must-have).
          echo "Waiting 30s for the Cloud Functions control plane to settle..."
          sleep 30

          check_once() {
            local list
            list="$(firebase functions:list --project "${PROJECT}" --json 2>&1)" || return 2
            echo "$list"
            local failed=0 fn
            for fn in "${REQUIRED_FUNCTIONS[@]}"; do
              # --json output carries the name token (e.g. "structureRecipe" as id or
              # in the resource path). Substring match is robust across CLI patch
              # versions.
              #
              # HERE-STRING, NOT A PIPE. This read `echo "$list" | grep -qF …`.
              #
              # OBSERVED on run 33044537911 (2026-08-27), the flow's first
              # successful functions deploy: the gate failed it, naming five
              # functions as [MISSING] that are present in the JSON the same
              # step had just printed, and each [MISSING] line is immediately
              # preceded by `echo: write error: Broken pipe`. The deploy itself
              # was fine — both target functions reached new Cloud Run revisions
              # (guardduplicatemessage 00001→00007, syncconversationlastmessage
              # 00004→00007).
              #
              # MECHANISM, argued rather than reproduced: `grep -q` exits the
              # moment it matches, leaving `echo` writing the rest of ~200KB
              # into a closed pipe; it dies on SIGPIPE, and `set -o pipefail`
              # takes the pipeline's status from that failure even though grep
              # succeeded. That also explains why the gate looked healthy for
              # so long — whether echo has finished writing when grep exits
              # depends on where the name sits in the JSON, so the four names
              # that passed were not more deployed than the five that failed.
              #
              # NOT reproduced locally: Windows/Git Bash does not raise the
              # SIGPIPE that a Linux runner does, so a local probe returns a
              # false all-clear. The fix is structural instead of measured —
              # a here-string is not a pipeline, so there is no second exit
              # status for pipefail to read and no writer to kill. The next
              # functions deploy is the real test; if a [MISSING] line ever
              # appears again WITHOUT a broken-pipe line above it, that is a
              # different bug and this comment is not about it.
              if grep -qF "\"${fn}\"" <<< "$list"; then
                echo "  [OK] ${fn} present"
              else
                echo "  [MISSING] ${fn} not in deployed function list" >&2
                failed=1
              fi
            done
            return $failed
          }

          if check_once; then
            echo "Post-deploy smoke gate passed — all required functions confirmed present."
            exit 0
          fi

          echo "First smoke check missed a function — settling 20s more and retrying once..." >&2
          sleep 20
          if check_once; then
            echo "Post-deploy smoke gate passed on retry."
            exit 0
          fi

          echo "" >&2
          echo "::error::Post-deploy smoke gate FAILED — one or more expected functions are missing after a settle + retry. The deploy may have partially failed on the backend even though the firebase CLI exited 0. NOTE: auto-rollback does NOT run from here — its \`if:\` has no status-check function, so GitHub ANDs an implicit success() that is already false. Check the Cloud Run revisions by hand." >&2
          exit 1

      # TTL policies ride in firestore.indexes.json (`"ttl": true`), and the
      # firebase CLI does not say whether Firestore accepted one. This prints
      # the live list so the run log answers it. Read-only; a new policy shows
      # CREATING for a while before ACTIVE.
      - name: List Firestore TTL policies
        if: env.DEPLOY_TARGET == 'indexes' || env.DEPLOY_TARGET == 'all'
        run: gcloud firestore fields ttls list --project "$FIREBASE_PROJECT_ID"

      # ─── AUTO-ROLLBACK ON FAILED DEPLOY (BUT-1424) ───────────────────────────
      #
      # Runs ONLY when the Deploy step or the post-deploy smoke gate failed — NOT
      # when the pre-deploy rules gate failed (nothing was deployed in that case,
      # so a bare `if: failure()` would wrongly "roll back" an untouched backend).
      #
      #   - Functions: traffic-swap each captured Cloud Run service back to the
      #     revision it served before this deploy (atomic, ~seconds, no rebuild).
      #     A swap to the already-current revision is a harmless no-op, so it is
      #     safe to attempt whenever functions were in scope.
      #   - Rules / indexes / storage: re-release the prior committed config from
      #     PREV_DEPLOY_REF.
      #
      # The step ALWAYS ends non-zero: a rollback means the forward deploy failed,
      # and the job must stay red so the incident is not masked from alerting. It
      # also logs loudly that PREV_DEPLOY_REF is not *guaranteed* healthy — a human
      # must confirm the prior version was good.
      #
      # Production only: a failed staging deploy is left as it failed, for
      # someone to read, and nothing is re-released into it automatically.
      - name: Auto-rollback on deploy failure
        if: env.DEPLOY_ENV == 'production' && env.BRING_UP != 'true' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          set -uo pipefail
          PROJECT="$FIREBASE_PROJECT_ID"
          REGION=europe-west1
          echo "::warning::Deploy failed — attempting auto-rollback. Verify the previous ref (${PREV_DEPLOY_REF:-<none>}) was actually healthy; rollback does NOT prove the prior version was good."
          echo "Targets completed before failure: $(cat reached-targets.txt 2>/dev/null | tr '\n' ' ')"

          gcloud config set project "$PROJECT" >/dev/null 2>&1 || true

          # 1. Functions — traffic-swap each captured service to its prior revision.
          if [ "$DEPLOY_TARGET" = "functions" ] || [ "$DEPLOY_TARGET" = "all" ]; then
            if [ -s rollback-baseline/cloud-run-revisions.csv ]; then
              while IFS=',' read -r svc rev; do
                [ -z "${svc:-}" ] && continue
                if [ -z "${rev:-}" ]; then
                  echo "  skip ${svc} (no prior revision captured — likely a brand-new function)"
                  continue
                fi
                echo "  rolling ${svc} -> ${rev}"
                gcloud run services update-traffic "$svc" --region "$REGION" \
                  --to-revisions="${rev}=100" --quiet \
                  || echo "::warning::traffic-swap failed for ${svc} — revert manually to ${rev}"
              done < rollback-baseline/cloud-run-revisions.csv
            else
              echo "::warning::No Cloud Run revision baseline — cannot auto-revert functions. Redeploy ${PREV_DEPLOY_REF:-the previous source} manually."
            fi
          fi

          # 2. Rules / indexes / storage — re-release the prior committed config.
          if [ -n "${PREV_DEPLOY_REF:-}" ]; then
            git checkout "$PREV_DEPLOY_REF" -- firestore.rules firestore.indexes.json storage.rules 2>/dev/null || true
            case "$DEPLOY_TARGET" in
              rules)    firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive || echo "::warning::rules rollback failed" ;;
              indexes)  firebase deploy --only firestore:indexes --project "$PROJECT" --non-interactive || echo "::warning::indexes rollback failed" ;;
              storage)  firebase deploy --only storage --project "$PROJECT" --non-interactive || echo "::warning::storage rollback failed" ;;
              all)      firebase deploy --only firestore:rules,firestore:indexes,storage --project "$PROJECT" --non-interactive || echo "::warning::config rollback failed" ;;
              functions) : ;;  # no config was deployed
            esac
            git checkout HEAD -- firestore.rules firestore.indexes.json storage.rules 2>/dev/null || true
          else
            echo "::warning::No previous ref resolved — skipping rules/indexes/storage rollback."
          fi

          echo "Rollback attempt complete. Failing the job so the incident is not masked."
          exit 1

      - name: Upload rollback baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-baseline
          path: rollback-baseline/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Firebase deploy"
            echo ""
            echo "- Environment: \`${DEPLOY_ENV}\`"
            echo "- Project: \`${FIREBASE_PROJECT_ID}\`"
            echo "- Target: \`${DEPLOY_TARGET}\`"
            echo "- Trigger: \`${{ github.event_name }}\` (\`${{ github.ref }}\`)"
            echo "- Status: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
