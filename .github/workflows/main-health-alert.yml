name: Main CI Health Alert

# Solo-dev safety net (BUT-435 follow-up): main sat red for days unnoticed
# because bot-authored merge commits don't email a human. When any gating
# workflow finishes on `main`, re-check the latest result of ALL gating
# workflows. If any is failing, open (or update) a single tracking issue so a
# red main is surfaced immediately. When every gate is green again, auto-close
# it. The tracking issue notifies repo watchers via GitHub's normal channels.
#
# Two visibility fixes after the 2026-07-16 → 07-26 streak, where Run Tests was
# red for 41 consecutive runs while this workflow's own badge stayed green:
#   1. `core.setFailed` when any gate is red, so this run's conclusion matches
#      what it found instead of being unconditionally `success`.
#   2. A fingerprinted re-comment on the tracking issue when the failing set
#      changes or once every 24h — GitHub sends no notification for the body
#      edit this workflow was doing, so the founder got exactly one ping in
#      twelve days.
# This workflow still gates nothing: it runs after the fact and no commit,
# deploy or merge waits on its result.

on:
  workflow_run:
    # BUT-1425: watch ALL critical gating workflows, not just the original 3.
    # A workflow that doesn't run on `main` simply never appears in the run list
    # and is a harmless no-op (filtered out below). Deliberately excluded: this
    # workflow itself (recursion), Adoption Status Nightly (chore, not a gate),
    # and Release version bump (tag/manual, not a main-push gate).
    workflows:
      - Run Tests
      - Build Validation
      - Architecture & Code Quality Validation
      - Firestore Rules
      - Deploy Firebase
      - E2E Tests
      - Dependency Audit
      - LLM Golden Tests
      - Model Version Guard
      - SBOM (CycloneDX)
      - Prompt Changelog Gate
      - Cloud Functions Unit Tests
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  health:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // BUT-1425: keep this list in sync with the workflow_run trigger
            // list above. A gate whose workflow never ran on main is filtered
            // out (find() → undefined), so listing one that doesn't run on main
            // is safe.
            const gates = [
              'Run Tests',
              'Build Validation',
              'Architecture & Code Quality Validation',
              'Firestore Rules',
              'Deploy Firebase',
              'E2E Tests',
              'Dependency Audit',
              'LLM Golden Tests',
              'Model Version Guard',
              'SBOM (CycloneDX)',
              'Prompt Changelog Gate',
              'Cloud Functions Unit Tests',
            ];
            const TITLE = '🔴 main CI is failing';
            const OWNER_HANDLE = 'Malingisslen'; // solo founder — assign + @mention so it actually notifies
            const { owner, repo } = context.repo;

            // A `cancelled`/`skipped`/`stale`/`null` run is INCONCLUSIVE — with
            // cancel-in-progress, rapid pushes leave a cancelled run as the
            // newest, which previously masked an earlier real failure (and
            // could falsely auto-close the tracking issue). So per gate, take
            // the most recent run with a CONCLUSIVE verdict, skipping the rest.
            const CONCLUSIVE = new Set(['success', 'failure', 'timed_out']);
            const RED = new Set(['failure', 'timed_out']);

            // Latest completed main run per gating workflow (one API page).
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, branch: 'main', status: 'completed', per_page: 100,
            })).data.workflow_runs;
            const latest = gates
              .map((name) => runs.find((r) => r.name === name && CONCLUSIVE.has(r.conclusion)))
              .filter(Boolean);
            const failing = latest.filter((r) => RED.has(r.conclusion));

            // Find our existing open tracking issue by exact title.
            const openIssues = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })).data;
            const issue = openIssues.find((i) => i.title === TITLE && !i.pull_request);

            if (failing.length > 0) {
              const list = failing
                .map((r) => `- ❌ **${r.name}** — ${r.html_url} (\`${r.head_sha.slice(0, 8)}\`)`)
                .join('\n');
              const body = `@${OWNER_HANDLE} — \`main\` CI is red:\n\n${list}\n\n_Auto-updated by Main CI Health Alert. This issue closes itself when all gates are green again._`;

              // Stable identity of "which gates are red right now". Embedded as
              // an HTML comment in every re-notification so the next run can
              // tell "still the same breakage" from "something new broke"
              // without parsing the prose.
              const fingerprint = failing.map((r) => r.name).sort().join(' | ');
              const marker = `<!-- gates: ${fingerprint} -->`;

              let issueNumber;
              if (issue) {
                issueNumber = issue.number;
                // Keep it assigned so it stays in the owner's notifications.
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, body, assignees: [OWNER_HANDLE],
                });

                // A body edit fires NO GitHub notification — that is why the
                // 2026-07-16 → 07-26 red streak pinged the founder exactly once
                // (on issue creation) across 41 failed Run Tests runs. Comments
                // DO notify, so re-comment when the breakage changes or once a
                // day while it persists. Rate-limited to 24h because this
                // workflow fires once per completed gate (~12× per push).
                const comments = (await github.rest.issues.listComments({
                  owner, repo, issue_number: issue.number, per_page: 100,
                })).data;
                const last = comments[comments.length - 1];
                const ageHours = last
                  ? (Date.now() - new Date(last.created_at).getTime()) / 36e5
                  : Infinity;
                const changed = !last || !last.body.includes(marker);
                if (changed || ageHours > 24) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: `${marker}\n@${OWNER_HANDLE} — \`main\` is ${changed ? 'red on a new gate' : 'still red'}:\n\n${list}`,
                  });
                }
              } else {
                // First open: assignee + @mention both fire a notification, so
                // a red main reaches the solo founder even unwatched.
                const created = await github.rest.issues.create({
                  owner, repo, title: TITLE, body, assignees: [OWNER_HANDLE],
                });
                issueNumber = created.data.number;
              }

              // Make THIS workflow's own run red too. It gates nothing — no
              // commit, deploy or merge waits on it — but its conclusion was
              // unconditionally `success`, so the Actions list showed
              // "Main CI Health Alert ✅" while main was broken. A health check
              // whose own badge is always green is worse than no badge.
              core.setFailed(
                `main is red: ${fingerprint} — tracking issue #${issueNumber}`
              );
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '✅ All gating workflows are green on `main` — auto-closing.',
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
