  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "functions/src/__tests__/firestore-rules*.test.ts"
      - "functions/src/__tests__/reports-rules.test.ts"
      - "functions/src/__tests__/age-gate-rules.test.ts"
      - "functions/src/__tests__/account-maturity-rules.test.ts"
      - "functions/src/__tests__/recipe-comments-rules.test.ts"
      - "functions/src/__tests__/parse-corrections-v2-rules.test.ts"
      - "functions/src/__tests__/moderation-rules.test.ts"
      - "functions/src/__tests__/cook-snaps-and-message-mod-rules.test.ts"
      - "functions/src/__tests__/menus-rules.test.ts"
      - "functions/src/__tests__/audit-logs-rules.test.ts"
      - "functions/src/__tests__/llm-response-samples-rules.test.ts"
      - "functions/src/__tests__/iter102-rules.test.ts"
      - "functions/src/__tests__/comment-images-storage-rules.test.ts"
      - "functions/src/__tests__/cook-events-rules.test.ts"
      - "functions/src/__tests__/activity-events-rules.test.ts"
      - "functions/src/__tests__/feedback-rules.test.ts"
      - "functions/src/__tests__/admin-dashboard-rules.test.ts"
      - "functions/src/__tests__/friends-accept-rules.test.ts"
      - "functions/src/__tests__/recipe-ratings-rules.test.ts"
      - "functions/src/__tests__/realtime-menus-rules.test.ts"
      - "functions/src/__tests__/friend-categories-rules.test.ts"
      - "functions/src/__tests__/members-collection-group-rules.test.ts"
      - "functions/src/__tests__/acquisition-rules.test.ts"
      - "functions/src/__tests__/request-account-deletion.integration.test.ts"
      - "functions/src/__tests__/moderate-upload.integration.test.ts"
      - "functions/src/__tests__/sync-conversation-last-message.integration.test.ts"
      - "functions/src/__tests__/accept-friend-request.integration.test.ts"
      - "functions/src/__tests__/on-report-created.integration.test.ts"
      - "functions/src/__tests__/recipe-shared-read-rules.test.ts"
      - "functions/src/__tests__/family-rating-rules.test.ts"
      - "functions/src/__tests__/conversations-rules.test.ts"
