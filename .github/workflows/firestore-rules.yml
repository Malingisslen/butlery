name: Firestore Rules

# BUT-448: gates merges that touch firestore.rules or the rules-test files
# behind the rules-unit-testing suite. The Firestore emulator is started in
# the background; tests connect to it on 127.0.0.1:8080 (matches the host/port
# in functions/src/__tests__/*.test.ts).

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "functions/src/__tests__/firestore-rules*.test.ts"
      - "functions/src/__tests__/reports-rules.test.ts"
      - "functions/src/__tests__/age-gate-rules.test.ts"
      - "functions/src/__tests__/account-maturity-rules.test.ts"
      - "functions/src/__tests__/recipe-comments-rules.test.ts"
      - "functions/src/__tests__/parse-corrections-v2-rules.test.ts"
      - "functions/src/__tests__/moderation-rules.test.ts"
      - "functions/src/__tests__/cook-snaps-and-message-mod-rules.test.ts"
      - "functions/src/__tests__/menus-rules.test.ts"
      - "functions/src/__tests__/audit-logs-rules.test.ts"
      - "functions/src/__tests__/iter102-rules.test.ts"
      - "functions/src/__tests__/comment-images-storage-rules.test.ts"
      - "functions/src/__tests__/cook-events-rules.test.ts"
      - "functions/src/__tests__/activity-events-rules.test.ts"
      - "functions/src/__tests__/feedback-rules.test.ts"
      - "functions/src/__tests__/admin-dashboard-rules.test.ts"
      - "functions/src/__tests__/request-account-deletion.integration.test.ts"
      - "functions/src/__tests__/moderate-upload.integration.test.ts"
      - "functions/src/__tests__/sync-conversation-last-message.integration.test.ts"
      - "functions/src/__tests__/recipe-shared-read-rules.test.ts"
      - "functions/src/account/**"
      - "functions/src/storage/**"
      - "functions/src/messaging/**"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "functions/src/__tests__/firestore-rules*.test.ts"
      - "functions/src/__tests__/reports-rules.test.ts"
      - "functions/src/__tests__/age-gate-rules.test.ts"
      - "functions/src/__tests__/account-maturity-rules.test.ts"
      - "functions/src/__tests__/recipe-comments-rules.test.ts"
      - "functions/src/__tests__/parse-corrections-v2-rules.test.ts"
      - "functions/src/__tests__/moderation-rules.test.ts"
      - "functions/src/__tests__/cook-snaps-and-message-mod-rules.test.ts"
      - "functions/src/__tests__/menus-rules.test.ts"
      - "functions/src/__tests__/audit-logs-rules.test.ts"
      - "functions/src/__tests__/iter102-rules.test.ts"
      - "functions/src/__tests__/comment-images-storage-rules.test.ts"
      - "functions/src/__tests__/cook-events-rules.test.ts"
      - "functions/src/__tests__/activity-events-rules.test.ts"
      - "functions/src/__tests__/feedback-rules.test.ts"
      - "functions/src/__tests__/admin-dashboard-rules.test.ts"
      - "functions/src/__tests__/request-account-deletion.integration.test.ts"
      - "functions/src/__tests__/moderate-upload.integration.test.ts"
      - "functions/src/__tests__/sync-conversation-last-message.integration.test.ts"
      - "functions/src/__tests__/recipe-shared-read-rules.test.ts"
      - "functions/src/account/**"
      - "functions/src/storage/**"
      - "functions/src/messaging/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Rules unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # firebase-tools requires Java 21+ for the Firestore emulator.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.13.0

      - name: Install function deps
        working-directory: functions
        run: npm ci

      # Start the Firestore emulator on the same host/port the tests expect
      # (127.0.0.1:8080). `--project demo-test` keeps the emulator from
      # demanding GCP credentials. The trailing `&` puts it in the
      # background; the wait-for-it loop blocks until the port answers.
      # Storage emulator (127.0.0.1:9199) is also started so the BUT-1049
      # comment-images storage rules test (`comment-images-storage-rules.test.ts`)
      # can run under `test:rules:all`. Firestore stays on 8080.
      - name: Start Firestore + Storage emulators
        run: |
          firebase emulators:start --only firestore,storage --project demo-test &
          echo "Waiting for Firestore emulator on 127.0.0.1:8080..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "Firestore emulator is up."
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080 >/dev/null
          echo "Waiting for Storage emulator on 127.0.0.1:9199..."
          for i in $(seq 1 60); do
            # Storage emulator answers 501 to a bare GET on its root — a
            # non-zero HTTP code still proves the port is live, so check
            # connectivity rather than a 2xx status.
            if curl -s -o /dev/null http://127.0.0.1:9199 2>/dev/null; then
              echo "Storage emulator is up."
              break
            fi
            sleep 1
          done

      - name: Run rules unit tests
        working-directory: functions
        run: npm run test:rules:all

      - name: Stop emulator
        if: always()
        run: pkill -f "firebase" || true
