      - "functions/src/__tests__/shared-shopping-lists-rules.test.ts"
      - "functions/src/__tests__/purge-dormant-family-data.integration.test.ts"
      - "functions/src/__tests__/enforce-group-minor-membership.integration.test.ts"
      - "functions/src/__tests__/leave-group-conversation.integration.test.ts"
      - "functions/src/__tests__/analyze-corrections-alias.test.ts"
      - "functions/src/family/**"
      - "functions/src/account/**"
      - "functions/src/storage/**"
      - "functions/src/messaging/**"
      - "functions/src/social/**"
      - "functions/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Rules unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # BUT-1677: full history so the coverage gate can diff the match blocks
      # in firestore.rules against the base revision. A shallow clone has no
      # base to compare with and the gate would silently skip.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # firebase-tools requires Java 21+ for the Firestore emulator.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.13.0

      - name: Install function deps
        working-directory: functions
        run: npm ci

      # Start the Firestore emulator on the same host/port the tests expect
      # (127.0.0.1:8080). `--project demo-test` keeps the emulator from
      # demanding GCP credentials. The trailing `&` puts it in the
      # background; the wait-for-it loop blocks until the port answers.
      # Storage emulator (127.0.0.1:9199) is also started so the BUT-1049
      # comment-images storage rules test (`comment-images-storage-rules.test.ts`)
      # can run under `test:rules:all`. Firestore stays on 8080.
      - name: Start Firestore + Storage emulators
        run: |
          firebase emulators:start --only firestore,storage --project demo-test &
          echo "Waiting for Firestore emulator on 127.0.0.1:8080..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "Firestore emulator is up."
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080 >/dev/null
          echo "Waiting for Storage emulator on 127.0.0.1:9199..."
          for i in $(seq 1 60); do
            # Storage emulator answers 501 to a bare GET on its root — a
            # non-zero HTTP code still proves the port is live, so check
            # connectivity rather than a 2xx status.
            if curl -s -o /dev/null http://127.0.0.1:9199 2>/dev/null; then
              echo "Storage emulator is up."
              break
            fi
            sleep 1
          done

      - name: Run rules unit tests
        working-directory: functions
        run: npm run test:rules:all

      # BUT-1677: green assertions say nothing about the paths nobody asserted
      # on. Pull the emulator's own per-project coverage (it is scoped per
      # projectId and every suite uses its own, so the script unions them),
      # render a per-block hit table into the job summary, and FAIL if a match
      # block that did not exist on the base revision was never evaluated.
      # Must run BEFORE "Stop emulator" — the report dies with the emulator.
      #
      # BUT-1707: "new" is decided from the base revision below, so the
      # fetch-depth: 0 checkout above is load-bearing — a shallow clone turns
      # this gate into a no-op that still prints green.
      #
      # BUT-1708: the run also prints and persists the untested-match-block
      # count (rules-coverage/coverage-summary.json, uploaded below). That
      # number is REPORT-ONLY by decision — no floor, no ratchet; the rationale
      # and the conditions for revisiting it are in the script's header.
      - name: Rules coverage report + new-block gate
        working-directory: functions
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/rules-coverage-report.js --out ../rules-coverage --base "$BASE_SHA"
          else
            node scripts/rules-coverage-report.js --out ../rules-coverage
          fi

      - name: Upload rules coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-coverage
          path: rules-coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop emulator
        if: always()
        run: pkill -f "firebase" || true
