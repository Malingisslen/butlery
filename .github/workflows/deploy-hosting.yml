# Publishes the legal pages (privacy policy + terms, sv/en) to their OWN hosting
# site by hand.
#
# MANUAL ONLY (workflow_dispatch), behind the `production` environment's
# reviewer gate like deploy-firebase.yml.
#
# Deliberately NOT the app's site (target `app`): that would publish the whole
# Flutter web app to the public before any store review, and would need a
# Flutter build and carry the app's service worker. This site holds static
# files only: hosting/legal/ (the page shells) plus assets/legal/*.md copied to
# assets/legal/, the same bytes the app bundles — so the hosted text and the
# in-app text cannot drift. No build step, no Flutter, no .env.
#
# First run: the legal site must exist in the project. The job tries
# to create it and carries on if it already exists; if the id is taken by
# another Firebase project the create step fails loudly — pick another id in
# .firebaserc (`targets.<project id>.hosting.legal`) and rerun.
name: Deploy Hosting (legal pages)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the current ref to the legal site"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-hosting-legal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    timeout-minutes: 10
    steps:
      - name: Refuse without the confirmation word
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Type DEPLOY in the confirm field to publish. Nothing was deployed." >&2
          exit 1

      - uses: actions/checkout@v6

      - name: Assemble the site
        # Pages at the root, markdown under assets/legal/ (the path legal.js
        # fetches). Fails if any of the files is missing or empty, so a rename
        # in assets/legal/ cannot publish a page that renders nothing.
        run: |
          rm -rf build/legal-site
          mkdir -p build/legal-site/assets/legal
          cp hosting/legal/* build/legal-site/
          cp assets/legal/privacy_policy_sv.md assets/legal/privacy_policy_en.md \
             assets/legal/terms_of_service_sv.md assets/legal/terms_of_service_en.md \
             build/legal-site/assets/legal/
          cp web/favicon.png build/legal-site/favicon.png
          for f in privacy-sv.html privacy-en.html terms-sv.html terms-en.html radera-konto.html delete-account.html \
                   index.html legal.js legal.css \
                   assets/legal/privacy_policy_sv.md assets/legal/privacy_policy_en.md \
                   assets/legal/terms_of_service_sv.md assets/legal/terms_of_service_en.md; do
            test -s "build/legal-site/$f" || { echo "::error::build/legal-site/$f missing or empty" >&2; exit 1; }
          done
          ls -R build/legal-site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.13.0

      # Short-lived token from Workload Identity Federation, no stored key. The
      # action exports GOOGLE_APPLICATION_CREDENTIALS for firebase and
      # CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE for gcloud.
      - name: Authenticate to Google Cloud (WIF)
        id: wif
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Guard — project matches the environment
        env:
          WIF_PROJECT_ID: ${{ steps.wif.outputs.project_id }}
        run: |
          # The environment's variable, the `.firebaserc` production alias and
          # the WIF token must all name the same project before anything runs.
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::vars.FIREBASE_PROJECT_ID is empty for the production environment." >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$(jq -r '.projects.production // empty' .firebaserc)" ]             || { echo "::error::vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the production alias in .firebaserc." >&2; exit 1; }
          [ "$WIF_PROJECT_ID" = "$FIREBASE_PROJECT_ID" ]             || { echo "::error::The WIF token belongs to '$WIF_PROJECT_ID', not '$FIREBASE_PROJECT_ID'." >&2; exit 1; }

      - name: Ensure the legal site exists
        run: |
          SITE=$(jq -r --arg p "$FIREBASE_PROJECT_ID" '.targets[$p].hosting.legal[0]' .firebaserc)
          test -n "$SITE" && test "$SITE" != "null" || { echo "::error::no legal hosting target in .firebaserc" >&2; exit 1; }
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          # The CLI prints each site as "projects/<n>/sites/<id>".
          if firebase hosting:sites:list --project "$FIREBASE_PROJECT_ID" --json | grep -q "/sites/$SITE\""; then
            echo "Site $SITE exists."
          else
            firebase hosting:sites:create "$SITE" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

      - name: Deploy hosting target legal
        run: |
          firebase deploy --only hosting:legal --project "$FIREBASE_PROJECT_ID" --non-interactive \
            --message "legal pages ${GITHUB_SHA::7} via deploy-hosting.yml"
          echo "Published: https://${SITE}.web.app/privacy-sv.html"
