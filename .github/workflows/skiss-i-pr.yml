name: Skiss mot app i PR

# A PR that touches a view says in its description what it did about the
# sketch: either a sketch-against-app image (design/skiss-mot-app/ or an
# attached picture) or "Skiss mot app: ej berörd" with a reason. Malin approves
# the image before merge. screen_register_test.dart holds the per-view rows.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/views/**'

permissions:
  contents: read

jobs:
  skiss-rad:
    runs-on: ubuntu-latest
    steps:
      - name: PR description has a Skiss mot app line
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*Skiss mot app:[[:space:]]*[^[:space:]<]'; then
            exit 0
          fi
          echo "::error::PR:en ändrar lib/views men beskrivningen saknar raden 'Skiss mot app: <bild eller länk>' eller 'Skiss mot app: ej berörd, <skäl>'."
          exit 1
