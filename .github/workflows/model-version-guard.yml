name: Model Version Guard

# BUT-1239: nightly guard that fails when a model family's published
# `latest_version.txt` in Firebase Storage exceeds the maximum version in
# the local hash registry (lib/services/parsing/_expected_model_hashes.dart).
#
# Clients fail-close on any model version they have no SHA-256 hash for
# (BUT-877). If `latest_version.txt` is bumped before the matching hash
# lands in the registry + ships in a client, every client silently drops
# to the slower rule-based / LLM parsing tier. This catches that drift.
#
# Signs in with Workload Identity Federation (BUT-2421): a short-lived token
# for a read-only service account, no stored key. The `model-guard` GitHub
# environment (no reviewers, so the nightly run is not held) holds the variables
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_MODELS_RO_SERVICE_ACCOUNT. The
# provider only accepts this repository's `model-guard` environment on main.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: model-guard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 — BUT-790 SHA-pin
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13 — BUT-790 SHA-pin
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MODELS_RO_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1 — BUT-790 SHA-pin

      - name: Run model-version guard
        id: guard
        run: |
          set -o pipefail
          python tools/ci/check_model_versions.py | tee "$RUNNER_TEMP/guard-output.txt"

      - name: Post result to job summary
        if: always()
        run: |
          {
            echo "## Model Version Guard"
            echo ""
            if [ -f "$RUNNER_TEMP/guard-output.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/guard-output.txt"
              echo '```'
            else
              echo "Guard did not produce output (failed before running —" \
                   "likely an auth error or a missing environment variable; see the failing step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
