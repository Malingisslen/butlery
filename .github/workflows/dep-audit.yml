name: Dependency Audit

# Scans pub and npm dependencies for known vulnerabilities.
# Runs on PRs that touch lockfiles, weekly on Monday 05:00 UTC, and on demand.
# Fails CI on HIGH or CRITICAL findings.

on:
  pull_request:
    paths:
      - "pubspec.lock"
      - "pubspec.yaml"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/dep-audit.yml"
      # BUT-771: also run on workflow / guard-script edits so node-version
      # drift can't sneak in via a workflow-only PR.
      - ".github/workflows/*.yml"
      - "tools/check_node_version_consistency.sh"
  # BUT-791: solo-dev pushes direct to main, so PR-only triggering meant
  # this workflow never ran in practice. Mirror the path filter on push.
  push:
    branches: [main]
    paths:
      - "pubspec.lock"
      - "pubspec.yaml"
      - "functions/package.json"
      - "functions/package-lock.json"
      - ".github/workflows/dep-audit.yml"
      - ".github/workflows/*.yml"
      - "tools/check_node_version_consistency.sh"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# BUT-812: cancel superseded runs on rapid pushes so audit lanes don't pile up.
concurrency:
  group: dep-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.1"

jobs:
  # BUT-771: assert every workflow's node-version matches functions/package.json
  # engines.node. Drift means CI tests under a different Node than prod runs.
  node-version-consistency:
    name: Node version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run node-version consistency guard
        run: bash tools/check_node_version_consistency.sh

  pub-audit:
    name: Pub vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 — BUT-790 SHA-pin
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: List outdated packages (informational)
        run: dart pub outdated --mode=null-safety --json || true

      - name: Dump dependency tree (informational)
        run: flutter pub deps || true

      - name: Run OSV Scanner on pubspec.lock
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.5
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --format=sarif
            --output=osv-pub.sarif

      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-pub.sarif
          category: osv-pub

      # continue-on-error above lets the SARIF upload run even on findings;
      # this gate re-asserts failure so CI reflects HIGH/CRITICAL correctly.
      - name: Enforce OSV result
        if: steps.osv.outcome == 'failure'
        run: |
          echo "::error::OSV scanner found vulnerabilities in pubspec.lock"
          exit 1

  npm-audit:
    name: NPM vulnerability scan (functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # BUT-771: must match functions/package.json `engines.node`. Drift is
          # caught in CI via tools/check_node_version_consistency.sh (the
          # node-version-consistency job below).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fails on high/critical)
        run: npm audit --audit-level=high
