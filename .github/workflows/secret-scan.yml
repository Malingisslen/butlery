name: Secret scan

# Scans the checked-out tree (tracked files only — deps are never installed in
# this job) for credential-shaped strings. Complements the Claude-session-side
# workflow-guards secret-scan hook: this catches commits made OUTSIDE a Claude
# session too. Allowlist for public-by-design values: .gitleaks.toml.
# Baseline verified clean locally 2026-07-16, so failures here are new leaks.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --config .gitleaks.toml --exit-code 1
