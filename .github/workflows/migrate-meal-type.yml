# BUT-1875: one-time migration of stored recipe meal types to the app's
# spelling. Dry run unless `apply` is ticked; prints counts only. See
# functions/scripts/migrate-meal-type.js.
name: Migrate meal type

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Rewrite the meal types (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate core.mealType
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret not configured." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=butlery-app-1" >> "$GITHUB_ENV"

      - name: Run migration
        working-directory: functions
        env:
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then
            node scripts/migrate-meal-type.js --apply | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/migrate-meal-type.js | tee -a "$GITHUB_STEP_SUMMARY"
          fi
