# BUT-1875: one-time migration of stored recipe meal types to the app's
# spelling. Dry run unless `apply` is ticked; prints counts only. See
# functions/scripts/migrate-meal-type.js.
name: Migrate meal type

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Rewrite the meal types (unticked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate core.mealType
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install function deps
        working-directory: functions
        run: npm ci

      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret not configured." >&2
            exit 1
          fi
          # The environment's variable, the `.firebaserc` production alias and
          # the key must all name the same project before anything runs.
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo "::error::vars.FIREBASE_PROJECT_ID is empty for the production environment." >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$(jq -r '.projects.production // empty' .firebaserc)" ] \
            || { echo "::error::vars.FIREBASE_PROJECT_ID ($FIREBASE_PROJECT_ID) is not the production alias in .firebaserc." >&2; exit 1; }
          [ "$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.project_id // empty')" = "$FIREBASE_PROJECT_ID" ] \
            || { echo "::error::The service-account key does not belong to $FIREBASE_PROJECT_ID." >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Run migration
        working-directory: functions
        env:
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then
            node scripts/migrate-meal-type.js --apply | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/migrate-meal-type.js | tee -a "$GITHUB_STEP_SUMMARY"
          fi
