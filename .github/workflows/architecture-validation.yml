name: Architecture & Code Quality Validation

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  architecture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # BUT-495: record job start so the Report duration step at the end can
    # emit a structured timing line.
    - name: Record job start time
      run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyze
      run: |
        echo "🔍 Running Flutter analyze..."
        flutter analyze

    # BUT-768: fail PR if Python artifacts (Pillow / pip side-loads,
    # __pycache__, .pyc, .py) land under lib/. Past introduction of
    # lib/site-packages/ skewed every grep-based audit script's adoption
    # percentages. Guard catches re-introduction at PR time.
    - name: Forbid Python artifacts under lib/
      run: bash tools/check_no_python_artifacts.sh

    # BUT-758: closes the BUT-572 theme migration. Forbid AppColors.X in
    # views/widgets except the legitimate-keep set established by the
    # pilot + Waves A-D. Keep-set rationale:
    # - brand*, illustration*, overlay*, neutral*, transparent: theme-agnostic
    # - rustLight, creamDarker, greenMuted: decorative-only retentions
    # - vegetable_illustration.dart: decorative palette table (no context)
    # - social_collaborative_components.dart: `?? AppColors` safety-net fallbacks
    # - personal_tag_color_picker.dart: static `fromHex()` utility, no BuildContext
    - name: Forbid AppColors outside legitimate-keep set
      run: |
        set -e
        OFFENDERS=$(grep -rn "AppColors\." lib/views/ lib/widgets/ --include="*.dart" \
          | grep -v -E "AppColors\.(brand|illustration|overlay|neutral|transparent|rustLight|creamDarker|greenMuted)" \
          | grep -v "vegetable_illustration.dart" \
          | grep -v "social_collaborative_components.dart" \
          | grep -v "personal_tag_color_picker.dart" \
          || true)
        if [ -n "$OFFENDERS" ]; then
          echo "::error::AppColors.X used outside the legitimate-keep set:"
          echo "$OFFENDERS"
          exit 1
        fi
        echo "✅ AppColors usage matches the BUT-572 legitimate-keep set."

    - name: Run architecture tests
      run: |
        echo "🏗️ Running architecture compliance tests..."
        flutter test test/architecture/architecture_test.dart

    # Single validator run: tee stdout to the report file, fail the job on non-zero exit.
    - name: Run architecture validation tool
      run: |
        echo "🔧 Running comprehensive architecture validation..."
        set -o pipefail
        dart run tools/validate_architecture.dart 2>&1 | tee architecture_report.txt

    - name: Check for TODO/FIXME comments
      run: |
        echo "🔍 Checking for TODO/FIXME comments in critical files..."
        # Count TODOs in services and repositories (not including test files)
        TODO_COUNT=$(find lib/services lib/repositories -name "*.dart" -exec grep -l "TODO\|FIXME" {} \; | wc -l || echo "0")
        echo "Found $TODO_COUNT files with TODO/FIXME comments in critical directories"
        if [ "$TODO_COUNT" -gt 10 ]; then
          echo "⚠️ Warning: High number of TODO/FIXME comments found"
          echo "Consider addressing some of these before merging"
        fi
        
    - name: Upload architecture report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: architecture-validation-report
        path: |
          architecture_report.txt
          architecture_validation_report.json
        retention-days: 30

    # BUT-495: report duration; soft budget 5m — analyzer + arch tests only.
    - name: Report job duration
      if: always()
      env:
        BUDGET_MIN: 5
        JOB_LABEL: "Architecture Validation"
      run: |
        JOB_END=$(date +%s)
        DURATION_SEC=$((JOB_END - JOB_START))
        DURATION_MIN=$((DURATION_SEC / 60))
        DURATION_REM=$((DURATION_SEC % 60))
        {
          echo "## Build duration"
          echo ""
          echo "**${JOB_LABEL}**: ${DURATION_MIN}m ${DURATION_REM}s (budget ${BUDGET_MIN}m)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$DURATION_MIN" -ge "$BUDGET_MIN" ]; then
          echo "::warning::${JOB_LABEL} duration ${DURATION_MIN}m ${DURATION_REM}s exceeded budget ${BUDGET_MIN}m"
        fi
        
    - name: Comment PR with validation results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          try {
            const report = fs.readFileSync('architecture_validation_report.json', 'utf8');
            const data = JSON.parse(report);
            
            let comment = `## 🏗️ Architecture Validation Report\n\n`;
            comment += `**Status**: ${context.job.status === 'success' ? '✅ PASSED' : '❌ FAILED'}\n\n`;
            comment += `### 📊 Compliance Metrics\n`;
            comment += `- **Total Files**: ${data.stats.total_files}\n`;
            comment += `- **Firebase Compliance**: ${data.summary.compliance_rates.firebase}%\n`;
            comment += `- **Theme Compliance**: ${data.summary.compliance_rates.theme}%\n`;
            comment += `- **File Size Compliance**: ${data.summary.compliance_rates.file_size}%\n`;
            comment += `- **Total Violations**: ${data.summary.total_violations}\n\n`;
            
            if (data.summary.total_violations > 0) {
              comment += `### ⚠️ Issues Found\n`;
              comment += `Please review the uploaded architecture report for detailed violations.\n\n`;
            }
            
            comment += `*Generated by [Architecture Validation Workflow]*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not read architecture report:', error.message);
          }