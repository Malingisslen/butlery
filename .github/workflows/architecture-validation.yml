name: Architecture & Code Quality Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual triggering

env:
  FLUTTER_VERSION: '3.32.4'

jobs:
  architecture-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor -v
      
    - name: Run Flutter analyze
      run: |
        echo "🔍 Running Flutter analyze..."
        flutter analyze
        
    - name: Run architecture tests
      run: |
        echo "🏗️ Running architecture compliance tests..."
        flutter test test/architecture/architecture_test.dart
        
    - name: Run architecture validation tool
      run: |
        echo "🔧 Running comprehensive architecture validation..."
        dart run tools/validate_architecture.dart
        
    - name: Check for TODO/FIXME comments
      run: |
        echo "🔍 Checking for TODO/FIXME comments in critical files..."
        # Count TODOs in services and repositories (not including test files)
        TODO_COUNT=$(find lib/services lib/repositories -name "*.dart" -exec grep -l "TODO\|FIXME" {} \; | wc -l || echo "0")
        echo "Found $TODO_COUNT files with TODO/FIXME comments in critical directories"
        if [ "$TODO_COUNT" -gt 10 ]; then
          echo "⚠️ Warning: High number of TODO/FIXME comments found"
          echo "Consider addressing some of these before merging"
        fi
        
    - name: Generate architecture report
      if: always()
      run: |
        echo "📊 Generating architecture compliance report..."
        dart run tools/validate_architecture.dart > architecture_report.txt 2>&1 || true
        
    - name: Upload architecture report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: architecture-validation-report
        path: |
          architecture_report.txt
          architecture_validation_report.json
        retention-days: 30
        
    - name: Comment PR with validation results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = fs.readFileSync('architecture_validation_report.json', 'utf8');
            const data = JSON.parse(report);
            
            let comment = `## 🏗️ Architecture Validation Report\n\n`;
            comment += `**Status**: ${context.job.status === 'success' ? '✅ PASSED' : '❌ FAILED'}\n\n`;
            comment += `### 📊 Compliance Metrics\n`;
            comment += `- **Total Files**: ${data.stats.total_files}\n`;
            comment += `- **Firebase Compliance**: ${data.summary.compliance_rates.firebase}%\n`;
            comment += `- **Theme Compliance**: ${data.summary.compliance_rates.theme}%\n`;
            comment += `- **File Size Compliance**: ${data.summary.compliance_rates.file_size}%\n`;
            comment += `- **Total Violations**: ${data.summary.total_violations}\n\n`;
            
            if (data.summary.total_violations > 0) {
              comment += `### ⚠️ Issues Found\n`;
              comment += `Please review the uploaded architecture report for detailed violations.\n\n`;
            }
            
            comment += `*Generated by [Architecture Validation Workflow]*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not read architecture report:', error.message);
          }