name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - '.claude/**'
      - 'memory/**'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier to run'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - emulator
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.1'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        tier: [mock, emulator]
        # Note: Staging tests require proper staging Firebase project setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js for Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        uses: actions/setup-node@v4
        with:
          # firebase-tools v15.13.0 requires Node >=20
          node-version: '20'
          cache: 'npm'

      - name: Setup Java for Firebase Emulator (firebase-tools requires Java 21+)
        if: matrix.tier == 'emulator'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache global firebase-tools install
        if: matrix.tier == 'emulator'
        id: firebase-cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.npm-global
          key: firebase-tools-15.13.0-${{ runner.os }}

      - name: Install Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          if [ ! -x ~/.npm-global/bin/firebase ]; then
            npm install -g firebase-tools@15.13.0
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        run: firebase --version

      - name: Setup test directories
        run: |
          mkdir -p test/e2e/results
          chmod +x scripts/run_e2e_tests.sh

      - name: Run E2E Tests
        run: |
          ./scripts/run_e2e_tests.sh --tier ${{ matrix.tier }} --verbose
        env:
          # Firebase emulator environment (for emulator tests)
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.tier }}-failure
          path: test/e2e/results/
          retention-days: 7

  # Simple summary job
  test-summary:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## E2E Test Summary"
          echo ""
          echo "**Workflow:** ${{ github.workflow }}"
          echo "**Run:** ${{ github.run_number }}"
          echo "**Commit:** ${{ github.sha }}"
          echo ""
          
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed successfully!"
            exit 0
          else
            echo "❌ Some E2E tests failed. Check individual job logs for details."
            exit 1
          fi