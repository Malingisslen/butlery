name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Test tier to run'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - emulator
          - all

env:
  FLUTTER_VERSION: '3.32.4'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        tier: [mock, emulator]
        # Note: Staging tests require proper staging Firebase project setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Node.js for Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        run: npm install -g firebase-tools

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: |
          flutter --version
          flutter doctor -v

      - name: Verify Firebase CLI (emulator tests only)
        if: matrix.tier == 'emulator'
        run: firebase --version

      - name: Setup test directories
        run: |
          mkdir -p test/e2e/results
          chmod +x scripts/run_e2e_tests.sh

      - name: Run E2E Tests
        run: |
          ./scripts/run_e2e_tests.sh --tier ${{ matrix.tier }} --verbose
        env:
          # Firebase emulator environment (for emulator tests)
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.tier }}-failure
          path: test/e2e/results/
          retention-days: 7

  # Simple summary job
  test-summary:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## E2E Test Summary"
          echo ""
          echo "**Workflow:** ${{ github.workflow }}"
          echo "**Run:** ${{ github.run_number }}"
          echo "**Commit:** ${{ github.sha }}"
          echo ""
          
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed successfully!"
            exit 0
          else
            echo "❌ Some E2E tests failed. Check individual job logs for details."
            exit 1
          fi