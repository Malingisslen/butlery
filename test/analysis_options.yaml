# Analysis options for test directory
# Inherits from parent but with test-specific overrides

include: ../analysis_options.yaml

analyzer:
  errors:
    # Allow prints in test files for debugging
    avoid_print: ignore
    
    # These are common in test files
    prefer_const_constructors: ignore
    prefer_const_declarations: ignore
    
  exclude:
    # Exclude legacy/archived test code
    - legacy_archive/**
    # Exclude test tools from analysis
    - fix_test_initialization.dart
    - fix_unused_imports.dart