# Lefthook configuration for Butlery
# https://github.com/evilmartians/lefthook
#
# Install: npm install lefthook --save-dev
# Setup: npx lefthook install
# Manual run: npx lefthook run pre-commit

pre-commit:
  commands:
    # Format staged Dart files, then restage them (only the originally-staged files —
    # never `git add -A`, which would sweep in unrelated work from parallel sessions)
    format:
      glob: "*.dart"
      run: dart format {staged_files} && git add {staged_files}
      priority: 1

    # Scan for potential secrets in staged files
    # firebase_options.dart excluded (standard FlutterFire file with client-side API keys)
    # Pre-filter the file list because xargs -r is unreliable on Windows MinGW
    # (incorrectly invokes grep on empty input, falsely tripping the && cascade)
    # BUT-812: regex extended for Stripe (sk_live/sk_test), Slack bot tokens + webhooks.
    # AWS AKIA + Google AIza + OpenAI sk- + cert bodies + npm/GitHub tokens + service
    # accounts retained from prior coverage.
    secret-scan:
      glob: "*.{dart,ts,json,yaml,yml,env}"
      run: "files=$(echo {staged_files} | tr ' ' '\n' | grep -v firebase_options.dart || true); if [ -z \"$files\" ]; then exit 0; fi; echo \"$files\" | xargs grep -lE '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[a-zA-Z0-9]{20,}|sk_live_[A-Za-z0-9]{24,}|sk_test_[A-Za-z0-9]{24,}|xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+|hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+|-----BEGIN (RSA|EC) PRIVATE KEY|npm_[a-zA-Z0-9]{36}|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|ghs_[a-zA-Z0-9]{36}|\"type\":\\s*\"service_account\")' && echo Potential secrets detected! && exit 1 || true"

    # Run Flutter analyze (fatal on infos).
    # Wrapped in `timeout` because `dart analyze` has hung indefinitely on Windows
    # mid-commit (zombie dart.exe), deadlocking the commit (sprint iter-147). Normal
    # run is ~11s; 300s is generous headroom, and -k 30 SIGKILLs a hung process so
    # the commit fails fast (recoverable) instead of freezing forever. Workflow
    # sprint commits skip this step via LEFTHOOK_EXCLUDE=analyze (already run upstream).
    analyze:
      run: timeout -k 30 300 dart analyze --fatal-infos
      fail_text: "dart analyze found issues, OR timed out after 5m. If it TIMED OUT, a zombie analyzer deadlocked the commit (see iter-147): kill the stuck process (Windows: taskkill /F /IM dart.exe), stop any running 'Continuous dart analyze' monitor so two analyzers don't contend, then retry. Otherwise, fix the reported issues before committing."
      priority: 2

    # BUT-1217: catch CI-only architecture-guard violations in the staged diff
    # before they reach the (slow) Architecture & Code Quality Validation job.
    # Currently the recurring BUT-581 raw `?? ''` ban (3x red-main incidents).
    # Diff-scoped + grep-only -> sub-second, zero false-positives on existing code.
    arch-guard:
      run: bash tools/check_staged_arch_guards.sh
      fail_text: "Architecture guard violation (see above). Use .orEmpty() etc."
      priority: 3

    # BUT-813 INFRA6 (lefthook<->CI parity): the flaky-test real-time guard ran
    # only in CI (test.yml). Mirror it pre-commit so DateTime.now()/long
    # Future.delayed regressions fail at commit time, not after a CI round-trip.
    # Grep-only -> sub-second. Heavyweight CI-only scanners (Trivy/TruffleHog,
    # full arch-validation) stay CI-only by design: they'd add minutes to every
    # local commit for marginal gain.
    # glob-gated: the guard only inspects test-file *content*, so it only needs
    # to run when a test file is actually staged. This keeps non-test commits
    # (lib-only, docs, config) free of its full-tree grep.
    real-time-guard:
      glob: "*_test.dart"
      run: bash scripts/check_test_real_time.sh
      fail_text: "Flaky-test real-time regression (see above): use fakeAsync/clock, not DateTime.now()/long Future.delayed."
      priority: 4

commit-msg:
  commands:
    # Validate conventional commit format
    # Format: type(scope): description
    # Types: feat, fix, docs, style, refactor, perf, test, chore, ci
    validate:
      run: node scripts/validate-commit-msg.js {1}
