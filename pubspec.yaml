name: butlery
description: "Smart receptapp som automatiserar receptflödet - från import/skapande av recept till veckomeny-generering och automatisk inköpslista."
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # ==================== CORE DEPENDENCIES ====================
  cupertino_icons: ^1.0.9

  # ==================== FIREBASE & BACKEND ====================
  firebase_core: ^4.11.0        # Updated for CVE-2025-0838 fix
  firebase_auth: ^6.5.4        # Updated for security patches
  cloud_firestore: ^6.6.0      # Updated for CVE-2024-7254 fix
  firebase_database: ^12.4.4   # Realtime Database for presence onDisconnect
  firebase_storage: ^13.4.3    # Updated for bug fixes
  firebase_analytics: ^12.4.3  # Updated for tracking improvements
  firebase_app_check: 0.4.5        # PINNED — security primitive (BUT-793). Bump explicitly via Dependabot review, never via `pub upgrade`.
  firebase_messaging: ^16.4.1  # Updated for FCM improvements
  firebase_performance: ^0.11.4+3  # For performance monitoring
  firebase_crashlytics: ^5.2.4  # Updated for reporting improvements
  firebase_remote_config: ^6.5.3  # Feature flags and A/B testing
  flutter_local_notifications: ^22.0.1  # Android notification channels (BUT-435: bumped to 21.x with Dart 3.10)
  timezone: ^0.11.0  # BUT-1242: zonedSchedule needs an explicit tz dependency. BUT-435: bumped to 0.11.x to match flutter_local_notifications 21.x
  device_info_plus: 12.3.0  # PINNED — 12.4.0+ ships a broken isiOSAppOnVision call gated on iOS 26.1 (a non-existent SDK), failing iOS Build Validation. Sibling pin connectivity_plus had the IDENTICAL speculative iOS-26 API confirmed STILL present on re-test 2026-06-24 (BUT-1367), so this pin is very likely still required too — and 13.x additionally forces win32 6.x → package_info_plus 10.x. Don't re-lift without expecting the same iOS failure.
  freerasp: 8.0.0  # PINNED — RASP rules / Frida detection (BUT-793). Bump explicitly; minor versions can change tampering thresholds. 8.0.0 reviewed (BUT-1218): its 5 breaking changes (onAllChecksDone→onAllChecksFinished, installerStore, reasons-list, blocklist, SuspiciousAppDetectionConfig) are all on surfaces we don't use; root/hook/tamper callbacks unchanged.

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.5+1
  get_it: ^9.2.1

  # ==================== LOCAL STORAGE ====================
  shared_preferences: ^2.5.5
  drift: ^2.31.0               # NOT SDK-blocked (Dart 3.10 satisfies current drift). Held at 2.29 by BUT-820: newer drift changed the encryption substrate, so drift + drift_dev + build_runner must move in lockstep only after the sqlcipher→sqlite3 migration lands. Bumping build_runner to 2.8.0+ then also sheds the discontinued build_resolvers/build_runner_core (BUT-554).
  sqlcipher_flutter_libs: ^0.7.0+eol  # Encrypted SQLite for Drift (replaces sqlite3_flutter_libs)
  flutter_secure_storage: ^10.3.1  # Platform-secure storage for sensitive data

  # ==================== NAVIGATION & UI ====================
  wakelock_plus: ^1.5.2  # Keep screen awake during cooking mode

  # ==================== NETWORKING ====================
  http: ^1.6.0
  connectivity_plus: 7.0.0  # PINNED — 7.1.0+ ships a NWPath.isUltraConstrained call gated on iOS 26.0 (a non-existent SDK), same speculative-API gambit as device_info_plus 12.4.0. Fails iOS Build Validation. RE-TESTED 2026-06-24 (BUT-1367, PR #188): 7.1.1 STILL has the isUltraConstrained call → iOS lane red (PathMonitorConnectivityProvider.swift:28). Pin confirmed required; do not re-lift until upstream drops the speculative iOS-26 API.

  # ==================== IMAGE HANDLING ====================
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.3
  flutter_image_compress: ^2.4.0
  image: ^4.9.1     # OCR image processing (EXIF/resize/JPEG). 4.9+ needs xml 7.x → Dart 3.11; 4.8.x is the newest archive-4.x build on Dart 3.10. Lift the ceiling at the next Dart bump.

  # ==================== PLATFORM INFO ====================
  package_info_plus: ^9.0.1

  # ==================== UTILITIES ====================
  uuid: ^4.5.3
  intl: ^0.20.2
  collection: ^1.19.1
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  clock: ^1.1.2  # For testable time-dependent code
  share_plus: ^12.0.2        # För utgående sharing (skicka till andra appar)
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  path: ^1.9.1
  crypto: ^3.0.7             # För OCR service image hashing och caching

  # ==================== PARSING & PROCESSING ====================
  html: ^0.15.6
  flutter_inappwebview: ^6.1.5
  csv: ^8.0.0                 # BUT-435: bumped to 8.x with Dart 3.10
  xml: ^7.0.1       # .xlsx import parsing (XlsxReader) — replaces excel (BUT-503); 7.x needs Dart 3.11
  flutter_onnxruntime: ^1.8.0  # On-device BERT NER inference (MIT licensed)

  # ==================== SOCIAL FEATURES (FAS 18) ====================
  timeago: ^3.7.1
  app_links: ^6.4.1          # BUT-434: Deep-link / share-intent handler. Replaces receive_intent (unverified publisher, single maintainer, Android-only). Cross-platform (iOS, Android, web, desktop).
  cloud_functions: ^6.3.3

  # ==================== SEARCH (Algolia - migration-ready) ====================
  algoliasearch: ^1.49.2     # Official Algolia SDK (can migrate to Meilisearch/Typesense later)
  html_unescape: ^2.0.0
  sqlite3: ^2.9.4
  web: ^1.1.1
  sembast_web: ^2.4.5          # Web-platform CacheDao backend (lib/core/cache/cache_dao_stub.dart)
  archive: ^4.0.0            # Zip handling for Paprika import + our own XlsxReader (BUT-503: decoupled from excel)
  http_certificate_pinning: 3.0.1  # PINNED — pin enforcement semantics (BUT-793). Bump explicitly with cert-rotation review.
  in_app_review: ^2.0.12            # BUT-678: prompt happy users for store reviews
  fl_chart: ^1.2.0
  dio: ^5.9.2  # Algolia SDK's HTTP client; imported directly by algolia_pinning_interceptor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ==================== CORE TESTING ====================
  test: ^1.26.2
  integration_test:
    sdk: flutter
  coverage: ^1.15.1
  
  # ==================== MOCKING (Mocktail preferred over Mockito) ====================
  mocktail: ^1.0.5
  build_runner: ^2.15.0  # Pinned to match drift_dev 2.29.0 — bump together (codegen breaks otherwise).
  drift_dev: ^2.29.0    # Code generator for Drift — stays in lockstep with build_runner 2.7.1 above.
  
  # ==================== FIREBASE MOCKING ====================
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2
  firebase_storage_mocks: ^0.8.0+1
  # ==================== TEST DATA GENERATION ====================
  fake_async: ^1.3.3  # For controlling time in tests
  
  # ==================== INTEGRATION TESTING FRAMEWORK ====================
  
  # ==================== CODE QUALITY ====================
  very_good_analysis: ^10.3.0

  # ==================== PERFORMANCE & ACCESSIBILITY ====================
  flutter_driver:
    sdk: flutter

  # ==================== BUILD TOOLS ====================
  # analyzer provided by test package - let pub determine compatible version
  cli_util: ^0.4.2  # For CLI utilities
  meta: ^1.16.0  # For annotations
  # sembast: needed by test/unit/core/cache/cache_dao_web_test.dart for the
  # in-memory factory (sembast/sembast_memory.dart) used to drive the web
  # CacheDao under test (BUT-555 audit 2026-05-04 — kept).
  sembast: ^3.8.9

  # Test-only platform interfaces imported directly by unit tests
  # (depend_on_referenced_packages enforcement).
  plugin_platform_interface: ^2.1.8
  firebase_core_platform_interface: ^7.1.0

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/legal/
    - assets/data/
    - assets/illustrations/
    - assets/illustrations/arta/
    - assets/seasonal/

  # UI Redesign Fonts
  # - JosefinSans: Headers, navigation (geometric, elegant, vintage feel)
  # - SpaceGrotesk: Body text (clean, readable sans-serif)
  fonts:
    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
        - asset: assets/fonts/JosefinSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
