name: butlery
description: "Smart app för recepthantering och måltidsplanering"
publish_to: 'none' # Privat projekt

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ==================== CORE PACKAGES ====================
  
  # State Management & Dependency Injection
  provider: ^6.1.1                    # Reaktiv state management med ChangeNotifier
  get_it: ^7.6.4                      # Dependency injection container
  
  # Data Persistence & Storage
  shared_preferences: ^2.2.2          # Lokal datalagring mellan app-sessioner
  
  # Utilities & ID Generation
  uuid: ^4.0.0                        # Generera unika ID:n för recept
  
  # ==================== FIREBASE BACKEND ====================
  
  firebase_core: ^2.32.0              # Firebase grundläggande funktioner
  firebase_auth: ^4.17.8              # Användarautentisering och konton
  cloud_firestore: ^4.15.9            # NoSQL-databas för strukturerad data
  firebase_storage: ^11.7.7           # Fil- och bildlagring i molnet
  firebase_messaging: ^14.9.3         # Push-notifikationer (framtida feature)
  
  # ==================== MEDIA & NETWORK ====================
  
  # Image handling
  image_picker: ^0.8.7                # Kamera och galleri-åtkomst
  cached_network_image: ^3.3.0        # Bildcaching för bättre performance
  flutter_cache_manager: ^3.3.1       # Avancerad cache-hantering
  
  # Network & Web parsing
  http: ^0.13.6                        # HTTP-förfrågningar för API-calls
  html: ^0.15.0                        # HTML-parsing för receptimport från webbsidor
  
  # ==================== UI & ICONS ====================
  
  cupertino_icons: ^1.0.8             # iOS-stil ikoner för Flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0               # Kodkvalitet och stilregler

# ==================== FLUTTER KONFIGURATION ====================

flutter:
  uses-material-design: true

  # Framtida assets kan läggas till här:
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # Framtida custom fonts kan läggas till här:
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf