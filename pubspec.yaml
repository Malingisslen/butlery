name: butlery
description: "Smart receptapp som automatiserar receptflödet - från import/skapande av recept till veckomeny-generering och automatisk inköpslista."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==================== CORE DEPENDENCIES ====================
  cupertino_icons: ^1.0.8

  # ==================== FIREBASE & BACKEND ====================
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_analytics: ^12.0.0
  firebase_app_check: ^0.4.0
  firebase_messaging: ^16.0.0  # For push notifications
  firebase_performance: ^0.11.0  # For performance monitoring

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.2
  get_it: ^8.0.0

  # ==================== LOCAL STORAGE ====================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ==================== NAVIGATION & UI ====================
  go_router: ^14.6.1

  # ==================== NETWORKING ====================
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # ==================== IMAGE HANDLING ====================
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0

  # ==================== UTILITIES ====================
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  url_launcher: ^6.3.1
  clock: ^1.1.1  # For testable time-dependent code
  share_plus: ^10.1.0        # För utgående sharing (skicka till andra appar)
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  path: ^1.9.0
  flutter_dotenv: ^5.2.1     # För säker API key hantering
  package_info_plus: ^8.0.2  # För att hämta app version och build info
  crypto: ^3.0.5             # För OCR service image hashing och caching

  # ==================== PARSING & PROCESSING ====================
  html: ^0.15.4
  flutter_inappwebview: ^6.1.5
  csv: ^6.0.0                 # For CSV file parsing
  excel: ^4.0.6               # For Excel file parsing

  # ==================== SOCIAL FEATURES (FAS 18) ====================
  timeago: ^3.6.1
  badges: ^3.1.2
  flutter_mentions: ^2.0.1  
  share_handler: ^0.0.22     # UPPDATERAD: Senaste stabila versionen för inkommande shares
  receive_intent: ^0.2.0     # För hantering av deep links och app launch intents

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  
  # ==================== CORE TESTING ====================
  test: ^1.25.2
  integration_test:
    sdk: flutter
  coverage: ^1.9.0
  
  # ==================== MOCKING (Mocktail preferred over Mockito) ====================
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  
  # ==================== FIREBASE MOCKING ====================
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0
  firebase_storage_mocks: ^0.8.0+1
  google_sign_in_mocks: ^0.3.0
  
  # ==================== TEST DATA GENERATION ====================
  faker: ^2.2.0
  fake_async: ^1.3.1  # For controlling time in tests
  
  # ==================== PROPERTY-BASED TESTING ====================
  glados: 1.1.7  # Property-based testing for Dart
  
  # ==================== VISUAL REGRESSION TESTING ====================
  # alchemist: ^0.7.0  # Temporarily disabled due to Flutter 3.32.4 compatibility issues
  golden_toolkit: ^0.15.0  # For testGoldens and screenMatchesGolden functions
  
  # ==================== INTEGRATION TESTING FRAMEWORK ====================
  patrol: ^3.13.0
  
  # ==================== CODE QUALITY ====================
  very_good_analysis: ^6.0.0
  
  # ==================== API MOCKING ====================
  http_mock_adapter: ^0.6.1
  
  # ==================== PERFORMANCE & ACCESSIBILITY ====================
  flutter_driver:
    sdk: flutter
  benchmark_harness: ^2.3.0
  
  # ==================== ANALYZER FIX ====================
  analyzer: ^6.4.1  # Kompatibel med Flutter 3.24
  cli_util: ^0.4.0  # For CLI utilities
  meta: ^1.11.0  # For annotations

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - .env
    - .env.development
    - .env.staging
    - .env.production
    - assets/legal/
