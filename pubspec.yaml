name: butlery
description: "Smart receptapp som automatiserar receptflödet - från import/skapande av recept till veckomeny-generering och automatisk inköpslista."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ==================== CORE DEPENDENCIES ====================
  cupertino_icons: ^1.0.8

  # ==================== FIREBASE & BACKEND ====================
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.2+7
  firebase_messaging: ^15.1.3  # For push notifications

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.2
  get_it: ^8.0.0

  # ==================== LOCAL STORAGE ====================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ==================== NAVIGATION & UI ====================
  go_router: ^14.6.1

  # ==================== NETWORKING ====================
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # ==================== IMAGE HANDLING ====================
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0

  # ==================== UTILITIES ====================
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.0        # För utgående sharing (skicka till andra appar)
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  path: ^1.9.0
  flutter_dotenv: ^5.2.1     # För säker API key hantering
  package_info_plus: ^8.0.2  # För att hämta app version och build info

  # ==================== PARSING & PROCESSING ====================
  html: ^0.15.4
  flutter_inappwebview: ^6.1.5

  # ==================== SOCIAL FEATURES (FAS 18) ====================
  timeago: ^3.6.1
  badges: ^3.1.2
  flutter_mentions: ^2.0.1  
  share_handler: ^0.0.22     # UPPDATERAD: Senaste stabila versionen för inkommande shares
  receive_intent: ^0.2.0     # För hantering av deep links och app launch intents

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  
  # ==================== TESTING DEPENDENCIES ====================
  mockito: ^5.4.4
  test: ^1.25.2
  integration_test:
    sdk: flutter
  coverage: ^1.9.0
  
  # ==================== ANALYZER FIX ====================
  analyzer: ^6.4.1  # Kompatibel med Flutter 3.24
  path: ^1.9.0      # For file path operations
  cli_util: ^0.4.0  # For CLI utilities

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - .env.development
    - .env.staging
    - .env.production
