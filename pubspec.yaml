name: butlery
description: "Smart receptapp som automatiserar receptflödet - från import/skapande av recept till veckomeny-generering och automatisk inköpslista."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==================== CORE DEPENDENCIES ====================
  cupertino_icons: ^1.0.8

  # ==================== FIREBASE & BACKEND ====================
  firebase_core: ^4.2.1        # Updated for CVE-2025-0838 fix
  firebase_auth: ^6.1.2        # Updated for security patches
  cloud_firestore: ^6.1.0      # Updated for CVE-2024-7254 fix
  firebase_storage: ^13.0.4    # Updated for bug fixes
  firebase_analytics: ^12.0.4  # Updated for tracking improvements
  firebase_app_check: ^0.4.0
  firebase_messaging: ^16.0.4  # Updated for FCM improvements
  firebase_performance: ^0.11.0  # For performance monitoring
  firebase_crashlytics: ^5.0.4  # Updated for reporting improvements
  firebase_remote_config: ^6.0.4  # Feature flags and A/B testing
  flutter_local_notifications: ^19.0.0  # For Android notification channels
  local_auth: ^2.3.0  # For biometric authentication (Face ID, Touch ID, fingerprint)
  device_info_plus: ^11.1.0  # For unique device identification
  flutter_jailbreak_detection: ^1.10.0  # Root/jailbreak detection

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.2
  get_it: ^9.0.5

  # ==================== LOCAL STORAGE ====================
  shared_preferences: ^2.3.2
  drift: ^2.30.0               # Modern SQL-based local storage
  sqlcipher_flutter_libs: ^0.6.4  # Encrypted SQLite for Drift (replaces sqlite3_flutter_libs)
  flutter_secure_storage: ^9.2.2  # Platform-secure storage for sensitive data
  pointycastle: ^4.0.0  # Cryptography for AES field-level encryption (matches firebase_auth_mocks)

  # ==================== NAVIGATION & UI ====================
  go_router: ^17.0.0
  dynamic_color: ^1.7.0  # Material You dynamic color support (Android 12+)

  # ==================== NETWORKING ====================
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  http_certificate_pinning: ^2.0.1  # SSL certificate pinning for MITM protection

  # ==================== IMAGE HANDLING ====================
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  permission_handler: ^12.0.1
  flutter_image_compress: ^2.3.0

  # ==================== UTILITIES ====================
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.1
  clock: ^1.1.1  # For testable time-dependent code
  share_plus: ^12.0.1        # För utgående sharing (skicka till andra appar)
  path_provider: ^2.1.4
  file_picker: ^10.3.3
  path: ^1.9.0
  flutter_dotenv: ^5.2.1     # För säker API key hantering
  crypto: ^3.0.5             # För OCR service image hashing och caching

  # ==================== PARSING & PROCESSING ====================
  html: ^0.15.4
  flutter_inappwebview: ^6.1.5
  csv: ^6.0.0                 # For CSV file parsing
  excel: ^4.0.6               # For Excel file parsing

  # ==================== SOCIAL FEATURES (FAS 18) ====================
  timeago: ^3.6.1
  receive_intent: ^0.2.0     # För hantering av deep links och app launch intents
  cloud_functions: ^6.0.4

  # ==================== SEARCH (Algolia - migration-ready) ====================
  algoliasearch: ^1.36.1     # Official Algolia SDK (can migrate to Meilisearch/Typesense later)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ==================== CORE TESTING ====================
  test: ^1.25.2
  integration_test:
    sdk: flutter
  coverage: ^1.9.0
  
  # ==================== MOCKING (Mocktail preferred over Mockito) ====================
  mocktail: ^1.0.4
  build_runner: ^2.10.4  # Downgraded for drift_dev compatibility
  drift_dev: ^2.12.0    # Code generator for Drift database (compatible version)
  
  # ==================== FIREBASE MOCKING ====================
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0
  firebase_storage_mocks: ^0.8.0+1
  google_sign_in_mocks: ^0.4.1
  
  # ==================== TEST DATA GENERATION ====================
  fake_async: ^1.3.1  # For controlling time in tests
  
  # ==================== INTEGRATION TESTING FRAMEWORK ====================
  patrol: ^4.1.0
  
  # ==================== CODE QUALITY ====================
  very_good_analysis: ^10.0.0

  # ==================== PERFORMANCE & ACCESSIBILITY ====================
  flutter_driver:
    sdk: flutter

  # ==================== BUILD TOOLS ====================
  # analyzer provided by test package - let pub determine compatible version
  cli_util: ^0.4.0  # For CLI utilities
  meta: ^1.11.0  # For annotations

flutter:
  generate: true
  uses-material-design: true
  
  # Assets
  assets:
    - .env
    - .env.development
    - .env.staging
    - .env.production
    - assets/legal/
