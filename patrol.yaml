# Patrol configuration — BUT-395 MVP
#
# Patrol is a real-device E2E framework. It compiles the Flutter app into a
# native instrumentation APK/IPA and drives it with platform-level automation.
#
# Local run (requires a booted Android emulator or iOS simulator):
#   firebase emulators:start --only auth,firestore,storage &
#   patrol test --target integration_test/patrol_test.dart
#
# CI: see .github/workflows/patrol_e2e.yml — nightly + on-demand.

app_name: Butlery

android:
  package_name: se.butlery.app

ios:
  bundle_id: se.butlery.app
